name: Schema check (fork PR)

# The `pull_request` run of a fork PR receives no repository secrets by
# default, so `ci.yml` cannot run the two hosted schema checks there. This is
# the companion that can.
#
# It uses `pull_request_target`, which executes **this file as it exists on the
# base branch** and supplies the read-only token. That is what covers a fork PR
# without handing a secret to code the fork controls, and it holds only while
# the rule below is obeyed:
#
#   Every `run:` executes `trusted/scripts/…` only. `pr/` is data — one
#   directory of migration files, passed to the trusted script through
#   `MIGRATIONS_DIR`, never executed.
#
# `pr/` is a sparse checkout of the merge ref, so the privileged job does not
# even materialise the rest of the fork's tree, and `persist-credentials` is
# off. `src/lib/__tests__/ci-schema-check-conditions.test.ts` fails if a `run:`
# here ever references `pr/`, and it also pins the base checkout, the sparse
# path and the fork-only condition.
#
# This check is additive: the PR-side "Migration History" job stays green on a
# fork PR because a skipped step cannot fail a job. Making fork verification
# *required* is a branch-protection change, not a workflow change.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: schema-fork-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  BUN_VERSION: "canary"

jobs:
  hosted:
    name: Migration History (fork PR)
    # Same-repo PRs are covered by `ci.yml`, which has the token. Only a fork
    # PR reaches this job.
    if: github.event.pull_request.head.repo.fork == true
    runs-on: [self-hosted, linux, backend-runner]
    timeout-minutes: 10
    defaults:
      run:
        working-directory: trusted
    steps:
      # The base commit: the exact code `ci.yml` would run for this PR's base,
      # already reviewed and merged. The token is only ever in scope here.
      - name: Checkout trusted base scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false

      # Data only. `refs/pull/<n>/merge` is the base tip merged with the fork's
      # head, so the migration set is what the PR would actually land; the
      # sparse checkout keeps the fork's source, workflows and scripts off the
      # disk entirely.
      - name: Checkout fork migration data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          path: pr
          sparse-checkout: supabase/migrations
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
          no-cache: true

      # A missing token is not a skip: both scripts report it as a configuration
      # fault and exit 1, so a green fork check cannot mean "the secret was
      # empty".
      - name: Check migration history consistency
        env:
          MIGRATIONS_DIR: ${{ github.workspace }}/pr/supabase/migrations
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_READ_ONLY_ACCESS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
        run: bun scripts/check-migrations.mjs

      - name: Check schema hygiene
        env:
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_READ_ONLY_ACCESS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
        run: bun scripts/check-schema-hygiene.mjs
