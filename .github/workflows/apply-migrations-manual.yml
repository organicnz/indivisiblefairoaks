name: Apply migrations (manual fallback)

# Temporary fallback for the self-hosted runner outage. Uses the same
# Management API applier as the normal Supabase workflow, over HTTPS, so it
# does not need IPv6 or a database password.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    name: Apply pending migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: canary

      - name: Apply pending migrations
        env:
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: bun scripts/apply-migrations.mjs

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Recovery path for a self-hosted runner outage. The normal Supabase
      # workflow deploys this function; doing it here means a manual migration
      # run is also enough to restore the nationwide scanner.
      - name: Deploy ICE scan edge function
        env:
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          bun x --bun supabase@3.2.0 functions deploy ice-scan \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt \
            --yes

      - name: Install Vault secrets and ICE scan schedule
        env:
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
        run: bun scripts/seed-ice-alert-cron.mjs

      - name: Report ICE scan health
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: bun scripts/check-ice-scan-health.mjs

      - name: Run the approved source crawl
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: bun scripts/crawl-ice-sources.mjs
