name: Regenerate Supabase types

# Operator utility. `src/types/supabase.ts` is generated from the hosted
# project, so a migration that lands without a local management token leaves it
# stale and the Supabase workflow's freshness job fails. This job uses the CI
# credential to produce the file and upload it as an artifact; an operator
# downloads it and commits the result. It never writes to the repository.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: regen-types
  cancel-in-progress: false

jobs:
  regen:
    name: Generate and upload src/types/supabase.ts
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: canary

      - name: Generate types from the live schema
        env:
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: bun run types:generate

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: supabase-types
          path: src/types/supabase.ts
          if-no-files-found: error
