name: Secret audit

# The live half of the secrets contract. `check-vercel-env.mjs`,
# `check-ci-env.mjs` and `check-edge-secrets.mjs` all run in pre-commit and all
# run offline: each proves a declared manifest agrees with the source, and not
# one of them can see a dashboard. A live audit on 2026-09-27 found production
# drift in every category they claim to cover — three `verify: true` edge
# secrets unset so commerce returned 503, all three `NEXT_PUBLIC_*` values held
# as GitHub *secrets* so fork PRs built against empty config, a `required: true`
# variable never set, and twelve secrets in the hosted edge project that no
# manifest declares and no function reads.
#
# This workflow is the only place the four stores are actually compared to the
# contracts, which means it is also the only place that can be wrong in a new
# way. Two properties keep it honest:
#
#   1. A store it cannot read is reported UNKNOWN, never as clean. Verified
#      during development: with a token that cannot read the project,
#      `vercel env ls` exits 0 and prints "No Environment Variables found",
#      while `vercel whoami` exits 1. A tool that trusted the listing would have
#      demanded that eleven correctly-configured variables be created.
#   2. Drift is compared against a committed baseline, so a repository that is
#      not yet clean does not sit permanently red — which is how the original
#      missing Stripe keys stayed missing. Only a NEW finding fails.
#
# Read-only. The audit has no mutation path; it prints the command that would
# fix each finding and exits.

on:
  schedule:
    # Off-peak UTC, and deliberately not on the hour: every scheduled workflow
    # in every repository fires at :00, and the shared runner fleet is the
    # constraint this project actually has.
    - cron: '37 4 * * *'
  workflow_dispatch:
    inputs:
      strict:
        description: 'Treat an unreadable store as a failure, not a warning'
        type: boolean
        default: false
      store:
        description: 'Audit a single store (e.g. edge-secret, github-secret)'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: secret-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Reconcile live secret stores against declared contracts
    runs-on: [self-hosted, linux, backend-runner]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install CLIs
        run: |
          set -euo pipefail
          command -v gh >/dev/null || { echo "::error::gh is required and was not found on the runner"; exit 1; }
          # Two mistakes here, both invisible until a job actually ran on this
          # fleet. It downloaded the **arm64** build onto an **X64** runner, and
          # it installed into root-owned /usr/local/bin while the job runs as the
          # unprivileged runner user — which is not fixable with sudo, because
          # there is no sudoers entry and deliberately so.
          #
          # `$HOME` is /home/runner and owned by uid 1001, so that is where these
          # go. It is writable only because the entrypoint gives the runner user a
          # HOME of its own instead of leaving it pointing at /root.
          case "$(uname -m)" in
            x86_64)        SUPA_ARCH=amd64 ;;
            aarch64|arm64) SUPA_ARCH=arm64 ;;
            *) echo "::error::unsupported architecture '$(uname -m)' for the supabase CLI"; exit 1 ;;
          esac
          BIN="$HOME/.local/bin"
          mkdir -p "$BIN"
          # Bun is the project's only runtime, and it lives in ~/.bun/bin.
          # `run:` steps do not source ~/.bashrc, so the installer's PATH edit
          # never reaches them — the path is added explicitly here instead of
          # being inherited by luck.
          BUN_BIN="$HOME/.bun/bin"
          export PATH="$BIN:$BUN_BIN:$PATH"
          printf '%s\n%s\n' "$BIN" "$BUN_BIN" >> "$GITHUB_PATH"

          if ! command -v supabase &>/dev/null; then
            curl -fsSL "https://github.com/supabase/cli/releases/latest/download/supabase_linux_${SUPA_ARCH}.tar.gz" \
              | tar -xz -C "$BIN" supabase
          fi
          # No Vercel CLI is installed, and none is needed.
          #
          # It used to be installed with `npm install -g vercel@latest`, which
          # was the last npm invocation in CI and the last reason this host
          # needed Node. It was also useless here: the CLI's bin is a
          # `#!/usr/bin/env node` script (so it needs a Node runtime this
          # project does not have), and it requires `vercel link` state that
          # cannot exist on a runner.
          #
          # The audit's live Vercel read goes through the REST API
          # (scripts/vercel-api.mjs) whenever VERCEL_TOKEN is present, which
          # is the CI path. When the token is absent the store is reported
          # UNKNOWN — the honest outcome, and the same one the CLI produced
          # when it failed to authenticate.
          supabase --version
          bun --version

      - name: Reconcile auth redirect settings
        id: auth
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          # The origin this deployment serves. A public URL, already declared as
          # a repository variable — it is the value behind metadataBase,
          # canonicals, sitemap and robots, so the hosted auth settings are
          # compared against the same source of truth rather than a second list.
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
        run: |
          set -uo pipefail
          bun --version >/dev/null 2>&1 || { echo "::warning::bun is not on this runner; auth redirect drift is UNKNOWN"; exit 0; }

          set +e
          bun scripts/check-auth-redirects.mjs --live | tee /tmp/auth-redirects.txt
          AUTH_STATUS=${PIPESTATUS[0]}
          set -e

          {
            echo "## Auth redirect settings"
            echo
            echo '```'
            cat /tmp/auth-redirects.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$AUTH_STATUS" -ne 0 ]; then
            echo "::error::Hosted auth site_url / redirect allow-list has drifted from ${NEXT_PUBLIC_SITE_URL}."
          fi
          exit "$AUTH_STATUS"

      - name: Reconcile
        id: audit
        env:
          # Deploys functions, applies migrations, and reads the edge secret
          # list. Needs the `secrets read` scope or the Supabase store is
          # reported UNKNOWN — which is the correct outcome, not a pass.
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          # A *public* identifier, not a credential — declared as a repository
          # variable, never a secret. Tells the audit which project to read, so
          # it does not depend on `supabase link` state that cannot exist on a
          # runner. Absent locally, the audit falls back to the linked checkout.
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          # Held in the repository since 2026-09-04 with no consumer. This is
          # that consumer: the Vercel store is otherwise unverifiable, and
          # Vercel is the one that actually serves requests.
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # Public identifiers, not credentials — declared as repository
          # variables. Tell the audit which project to read, so it uses the
          # REST API directly instead of depending on `vercel link` state that
          # cannot exist on a runner (and on a CLI that cannot run there).
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          # `gh secret list` needs repo-admin scope, which GITHUB_TOKEN does not
          # grant. Supplied as an optional fine-grained PAT; without it the
          # GitHub stores report UNKNOWN rather than clean.
          GH_AUDIT_TOKEN: ${{ secrets.GH_AUDIT_TOKEN }}
          GH_REPO: ${{ github.repository }}
          STRICT: ${{ inputs.strict }}
          STORE: ${{ inputs.store }}
        run: |
          set -uo pipefail

          # Prefer a PAT; fall back to GITHUB_TOKEN. A failure here is NOT fatal
          # — the audit reports the GitHub stores as UNKNOWN, which is the
          # honest outcome, and the other two stores are still reconciled.
          if [ -n "${GH_AUDIT_TOKEN:-}" ]; then
            export GH_TOKEN="$GH_AUDIT_TOKEN"
            echo "Using GH_AUDIT_TOKEN for the GitHub stores."
          else
            export GH_TOKEN="${GITHUB_TOKEN:-}"
            echo "::warning::GH_AUDIT_TOKEN is not set. The GitHub stores will most likely" \
                 "report UNKNOWN: listing repository secrets requires repo-admin scope," \
                 "which GITHUB_TOKEN does not grant. Create a fine-grained PAT with" \
                 "Actions -> Secrets: read and add it to the repository secrets."
          fi

          ARGS=()
          [ "$STRICT" = "true" ] && ARGS+=(--strict)
          [ -n "${STORE:-}" ] && ARGS+=("--store=$STORE")

          # Exit 1 means a NEW finding. Exit 0 with output means either clean or
          # fully baselined. Both are captured so the summary is always written.
          set +e
          bun scripts/secrets-audit.mjs "${ARGS[@]+"${ARGS[@]}"}" | tee /tmp/audit.txt
          STATUS=${PIPESTATUS[0]}
          set -e

          {
            echo "## Secret audit"
            echo
            echo '```'
            cat /tmp/audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Promote only the NEW findings to annotations. Re-firing 31 accepted
          # annotations every day trains everyone to ignore the whole job.
          grep -E '^\s*\[(CRITICAL|HIGH)\]' /tmp/audit.txt | while IFS= read -r line; do
            echo "::warning::$line"
          done

          if [ "$STATUS" -ne 0 ]; then
            echo "::error::New secret drift. See the job summary for the remediation command per finding."
          fi
          exit "$STATUS"
