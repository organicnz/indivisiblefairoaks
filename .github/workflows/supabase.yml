name: Supabase

# ── Dedicated Supabase delivery workflow ─────────────────────────────────────
# ALL Supabase-project delivery (edge functions + migrations + post-deploy
# verification) lives HERE — never in ci.yml. Canonical project:
# https://supabase.com/dashboard/project/mojsubkqjdruhpxbzgme/
#
# Triggers:
#   - push to main/mainDeploy touching supabase/** or this workflow
#   - manual dispatch (e.g. redeploy after a secret rotation)
#
# Runners: backend-runner ONLY ([self-hosted, linux, ARM64, backend-runner]).
# Frontend jobs must never land here; see ci.yml (frontend-runner).

on:
  push:
    branches: [main, mainDeploy]
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase.yml'
  workflow_dispatch:

concurrency:
  group: supabase-${{ github.ref }}
  cancel-in-progress: true

env:
  SUPABASE_PROJECT_REF: mojsubkqjdruhpxbzgme
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  # Retry config — Supabase edge network can have transient propagation delays
  SF_RETRIES: 3
  SF_RETRY_DELAY: 10

jobs:
  # ── 1. Deploy all edge functions + push migrations ────────────────────────
  deploy:
    name: Deploy functions + migrations
    runs-on: [self-hosted, linux, ARM64, backend-runner]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        run: |
          if ! command -v supabase &>/dev/null; then
            curl -fsSL https://github.com/supabase/cli/releases/latest/download/supabase_linux_arm64.tar.gz \
              | tar -xz -C /usr/local/bin supabase
          fi
          supabase --version

      - name: Deploy Edge Function — notify-contact (with retry)
        id: deploy-notify-contact
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        continue-on-error: true
        run: |
          set -o pipefail
          MAX_RETRIES="${SF_RETRIES:-3}"
          RETRY_DELAY="${SF_RETRY_DELAY:-10}"
          for attempt in $(seq 1 "$MAX_RETRIES"); do
            echo "🔁 Attempt $attempt/$MAX_RETRIES: deploying notify-contact..."
            if supabase functions deploy notify-contact \
              --project-ref "$SUPABASE_PROJECT_REF" \
              --no-verify-jwt 2>&1; then
              echo "✅ notify-contact deployed successfully"
              exit 0
            else
              if [ "$attempt" -lt "$MAX_RETRIES" ]; then
                echo "⚠️ Attempt $attempt failed, retrying in ${RETRY_DELAY}s..."
                sleep "$RETRY_DELAY"
              else
                echo "❌ notify-contact failed after $MAX_RETRIES attempts"
                exit 1
              fi
            fi
          done

      - name: Deploy Edge Function — checkout (with retry)
        id: deploy-checkout
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        continue-on-error: true
        run: |
          set -o pipefail
          MAX_RETRIES="${SF_RETRIES:-3}"
          RETRY_DELAY="${SF_RETRY_DELAY:-10}"
          for attempt in $(seq 1 "$MAX_RETRIES"); do
            echo "🔁 Attempt $attempt/$MAX_RETRIES: deploying checkout..."
            if supabase functions deploy checkout \
              --project-ref "$SUPABASE_PROJECT_REF" 2>&1; then
              echo "✅ checkout deployed successfully"
              exit 0
            else
              if [ "$attempt" -lt "$MAX_RETRIES" ]; then
                echo "⚠️ Attempt $attempt failed, retrying in ${RETRY_DELAY}s..."
                sleep "$RETRY_DELAY"
              else
                echo "❌ checkout failed after $MAX_RETRIES attempts"
                exit 1
              fi
            fi
          done

      - name: Deploy Edge Function — search (with retry)
        id: deploy-search
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        continue-on-error: true
        run: |
          set -o pipefail
          MAX_RETRIES="${SF_RETRIES:-3}"
          RETRY_DELAY="${SF_RETRY_DELAY:-10}"
          for attempt in $(seq 1 "$MAX_RETRIES"); do
            echo "🔁 Attempt $attempt/$MAX_RETRIES: deploying search..."
            if supabase functions deploy search \
              --project-ref "$SUPABASE_PROJECT_REF" \
              --no-verify-jwt 2>&1; then
              echo "✅ search deployed successfully"
              exit 0
            else
              if [ "$attempt" -lt "$MAX_RETRIES" ]; then
                echo "⚠️ Attempt $attempt failed, retrying in ${RETRY_DELAY}s..."
                sleep "$RETRY_DELAY"
              else
                echo "❌ search failed after $MAX_RETRIES attempts"
                exit 1
              fi
            fi
          done

      - name: Deploy Edge Function — webhook (with retry)
        id: deploy-webhook
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        continue-on-error: true
        run: |
          set -o pipefail
          MAX_RETRIES="${SF_RETRIES:-3}"
          RETRY_DELAY="${SF_RETRY_DELAY:-10}"
          for attempt in $(seq 1 "$MAX_RETRIES"); do
            echo "🔁 Attempt $attempt/$MAX_RETRIES: deploying webhook..."
            if supabase functions deploy webhook \
              --project-ref "$SUPABASE_PROJECT_REF" \
              --no-verify-jwt 2>&1; then
              echo "✅ webhook deployed successfully"
              exit 0
            else
              if [ "$attempt" -lt "$MAX_RETRIES" ]; then
                echo "⚠️ Attempt $attempt failed, retrying in ${RETRY_DELAY}s..."
                sleep "$RETRY_DELAY"
              else
                echo "❌ webhook failed after $MAX_RETRIES attempts"
                exit 1
              fi
            fi
          done

      - name: Deploy Edge Function — health (with retry)
        id: deploy-health
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        continue-on-error: true
        run: |
          set -o pipefail
          MAX_RETRIES="${SF_RETRIES:-3}"
          RETRY_DELAY="${SF_RETRY_DELAY:-10}"
          for attempt in $(seq 1 "$MAX_RETRIES"); do
            echo "🔁 Attempt $attempt/$MAX_RETRIES: deploying health..."
            if supabase functions deploy health \
              --project-ref "$SUPABASE_PROJECT_REF" \
              --no-verify-jwt 2>&1; then
              echo "✅ health deployed successfully"
              exit 0
            else
              if [ "$attempt" -lt "$MAX_RETRIES" ]; then
                echo "⚠️ Attempt $attempt failed, retrying in ${RETRY_DELAY}s..."
                sleep "$RETRY_DELAY"
              else
                echo "❌ health failed after $MAX_RETRIES attempts"
                exit 1
              fi
            fi
          done

      - name: Push Database Migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          # Authenticate Supabase CLI by writing access token to config
          mkdir -p ~/.supabase
          echo "access_token=$SUPABASE_ACCESS_TOKEN" > ~/.supabase/access
          supabase db push \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --password "$SUPABASE_DB_PASSWORD"

  # ── 2. Post-deploy verification — fail if any function is missing ───────────
  verify:
    name: Verify live edge functions
    runs-on: [self-hosted, linux, ARM64, backend-runner]
    needs: [deploy]
    timeout-minutes: 10
    steps:
      - name: Supabase project vars
        run: |
          echo "SUPABASE_PROJECT_REF=$SUPABASE_PROJECT_REF"
          echo "SUPABASE_ACCESS_TOKEN set: ${SUPABASE_ACCESS_TOKEN:+yes}"

      - name: Probe health edge function
        id: probe-health
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:
            ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -e
          EDGE_BASE="${NEXT_PUBLIC_SUPABASE_URL}/functions/v1"
          AUTH_HEADER="Authorization: Bearer ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}"
          APIKEY_HEADER="apikey: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}"

          echo "Probing $EDGE_BASE/health ..."
          STATUS=$(curl -s -o /tmp/health.json -w '%{http_code}' \
            -H "$AUTH_HEADER" -H "$APIKEY_HEADER" \
            "$EDGE_BASE/health" || echo 000)
          cat /tmp/health.json || true
          echo "health → HTTP $STATUS"
          if [ "$STATUS" = "404" ]; then
            echo "::error::health edge function missing (HTTP 404) — deploy failed"
            exit 1
          fi
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "503" ]; then
            echo "::error::health edge function unexpected HTTP $STATUS"
            exit 1
          fi

          # Each function must answer its validation path (4xx = alive,
          # 404 = not deployed). Any 404 fails the workflow.
          for FN in "notify-contact:{}" "search:{\"q\":\"\"}" "checkout:{}" "webhook:"; do
            NAME="${FN%%:*}"
            BODY="${FN#*:}"
            if [ -z "$BODY" ]; then
              CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
                -H "$AUTH_HEADER" -H "$APIKEY_HEADER" -H 'Content-Type: application/json' \
                "$EDGE_BASE/$NAME" || echo 000)
            else
              CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
                -H "$AUTH_HEADER" -H "$APIKEY_HEADER" -H 'Content-Type: application/json' \
                -d "$BODY" "$EDGE_BASE/$NAME" || echo 000)
            fi
            echo "$NAME → HTTP $CODE"
            if [ "$CODE" = "404" ]; then
              echo "::error::$NAME edge function missing (HTTP 404) — deploy failed"
              exit 1
            fi
          done
          echo "✅ All edge functions answering (project $SUPABASE_PROJECT_REF)"

      - name: Deployment summary
        if: always()
        run: |
          echo "==================================="
          echo "📊 DEPLOYMENT SUMMARY"
          echo "==================================="
          echo "Project: $SUPABASE_PROJECT_REF"
          echo "Attempted functions: notify-contact, checkout, search, webhook, health"
          echo "Workflow: indivisiblefairoaks/supabase.yml"
          echo "Runner: backend-runner (self-hosted, linux, ARM64)"
          if: always()
          echo "==================================="