name: Supabase

# ── Dedicated Supabase delivery workflow ─────────────────────────────────────
# ALL Supabase-project delivery (edge functions + migrations + post-deploy
# verification) lives HERE — never in ci.yml. Canonical project:
# https://supabase.com/dashboard/project/mojsubkqjdruhpxbzgme/
#
# Triggers:
#   - push to main touching supabase/** or this workflow
#   - manual dispatch (e.g. redeploy after a secret rotation)
#
# Runners: backend-runner ONLY ([self-hosted, linux, backend-runner]).
# Frontend jobs must never land here; see ci.yml (frontend-runner).

on:
  push:
    # `mainDeploy` has no remote ref; see the note in ci.yml. Removed
    # 2026-10-06.
    branches: [main]
    paths:
      - 'supabase/**'
      # A regenerated type file is the follow-up to a migration push. Without
      # this path the workflow would never run on the commit that fixes the
      # red type-freshness job below.
      - 'src/types/supabase.ts'
      - 'scripts/gen-types.mjs'
      - 'scripts/check-supabase-types.mjs'
      - 'scripts/supabase-access-token.mjs'
      - '.github/workflows/supabase.yml'
  workflow_dispatch:

concurrency:
  # Never auto-cancel a migration push mid-flight — a partial apply is worse
  # than a queued run. Simultaneous pushes serialize here instead.
  group: supabase-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Public Supabase identity. Kept in the variables store so all Supabase
  # configuration lives in one place and can be changed without a code review.
  SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
  # The Bun canary channel — same as ci.yml, and for the same reason: the
  # version pin it replaces (`1.4.4`) was never a GitHub release, and a
  # canary's version number is not monotonic against the stable releases, so
  # the channel is the only honest unit to pin.
  BUN_VERSION: "canary"

jobs:
  # ── 1. Deploy all edge functions ─────────────────────────────────────────
  deploy:
    name: Deploy edge functions
    runs-on: [self-hosted, linux]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate Supabase environment & credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_PROJECT_REF" || { echo "::error::SUPABASE_PROJECT_REF repository variable is missing"; exit 1; }
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::SUPABASE_ACCESS_TOKEN secret is missing"; exit 1; }

      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.6

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Type-check Edge Functions
        run: deno check --config supabase/functions/deno.json supabase/functions/*/*.ts supabase/functions/_shared/*.ts

      - name: Install Supabase CLI
        run: |
          # Two mistakes here, both invisible until a job actually ran on this
          # fleet. It downloaded the **arm64** build onto an **X64** runner, and
          # it installed into root-owned /usr/local/bin while the job runs as the
          # unprivileged runner user — not fixable with sudo, because there is no
          # sudoers entry and deliberately so.
          #
          # `$HOME` is /home/runner and owned by uid 1001, so that is where this
          # goes. It is writable only because the entrypoint gives the runner user
          # a HOME of its own instead of leaving it pointing at /root.
          case "$(uname -s)" in
            Linux)  SUPA_OS=linux ;;
            Darwin) SUPA_OS=darwin ;;
            *) echo "::error::unsupported OS '$(uname -s)' for the supabase CLI"; exit 1 ;;
          esac
          case "$(uname -m)" in
            x86_64)        SUPA_ARCH=amd64 ;;
            aarch64|arm64) SUPA_ARCH=arm64 ;;
            *) echo "::error::unsupported architecture '$(uname -m)' for the supabase CLI"; exit 1 ;;
          esac
          BIN="$HOME/.local/bin"
          mkdir -p "$BIN"
          export PATH="$BIN:$PATH"
          echo "$BIN" >> "$GITHUB_PATH"

          # One source of truth: scripts/supabase-cli.mjs pins the version used
          # by `bun x`. Derive it here rather than writing 3.2.0 a second time.
          SUPABASE_CLI_VERSION="$(
            grep -oE "supabase@[0-9]+\.[0-9]+\.[0-9]+" scripts/supabase-cli.mjs \
              | head -n 1 | cut -d@ -f2
          )"
          test -n "$SUPABASE_CLI_VERSION" || {
            echo "::error::Could not read the pinned Supabase CLI version from scripts/supabase-cli.mjs"
            exit 1
          }

          TARBALL="supabase_${SUPABASE_CLI_VERSION}_${SUPA_OS}_${SUPA_ARCH}.tar.gz"
          RELEASE="https://github.com/supabase/cli/releases/download/v${SUPABASE_CLI_VERSION}"
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          curl -fsSL "$RELEASE/checksums.txt" -o "$TMP/checksums.txt"
          curl -fsSL "$RELEASE/$TARBALL" -o "$TMP/$TARBALL"

          EXPECTED="$(awk -v f="$TARBALL" '$2 == f { print $1 }' "$TMP/checksums.txt")"
          test -n "$EXPECTED" || {
            echo "::error::No published checksum for $TARBALL"
            exit 1
          }
          if command -v sha256sum >/dev/null 2>&1; then
            ACTUAL="$(sha256sum "$TMP/$TARBALL" | awk '{print $1}')"
          else
            ACTUAL="$(shasum -a 256 "$TMP/$TARBALL" | awk '{print $1}')"
          fi
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Checksum mismatch for $TARBALL"
            echo "  expected: $EXPECTED"
            echo "  actual:   $ACTUAL"
            exit 1
          fi

          tar -xzf "$TMP/$TARBALL" -C "$BIN" supabase
          INSTALLED="$(supabase --version | head -n1 | tr -d '[:space:]')"
          if [ "$INSTALLED" != "$SUPABASE_CLI_VERSION" ]; then
            echo "::error::Supabase CLI version mismatch: expected $SUPABASE_CLI_VERSION, got $INSTALLED"
            exit 1
          fi
          echo "Supabase CLI $INSTALLED installed and verified."

          {
            echo '#!/usr/bin/env bash'
            echo 'set -e'
            echo 'ARGS=("$@")'
            echo 'if [[ "$*" == *"functions deploy"* && "$*" != *"--yes"* ]]; then'
            echo '  ARGS+=("--yes")'
            echo 'fi'
            echo 'ATTEMPT=1'
            echo 'MAX_ATTEMPTS=3'
            echo 'while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do'
            echo '  if "${ARGS[@]}"; then exit 0; fi'
            echo '  echo "⚠️ Command failed (attempt $ATTEMPT/$MAX_ATTEMPTS). Retrying in 5s..."'
            echo '  ATTEMPT=$((ATTEMPT + 1))'
            echo '  sleep 5'
            echo 'done'
            echo 'echo "::error::Command failed after $MAX_ATTEMPTS attempts: ${ARGS[*]}"'
            echo 'exit 1'
          } > "$BIN/supabase_retry"
          chmod +x "$BIN/supabase_retry"

      - name: Deploy Edge Function — notify-contact
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase_retry supabase functions deploy notify-contact \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt \
            --yes

      - name: Deploy Edge Function — search
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase_retry supabase functions deploy search \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt \
            --yes

      - name: Deploy Edge Function — health
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase_retry supabase functions deploy health \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt \
            --yes

      # NOTE: wall-e-chat / ice-case-brief / ice-source-refine / walle-refresh keep gateway JWT
      # verification ON (no --no-verify-jwt). Callers present a valid key: the
      # Next.js proxies use the publishable key, ops callers use the service-role key.
      - name: Deploy Edge Function — wall-e-chat
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase_retry supabase functions deploy wall-e-chat \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --yes

      - name: Deploy Edge Function — ice-case-brief
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase_retry supabase functions deploy ice-case-brief \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --yes

      # The source crawler calls this one from the Next server with the
      # service-role key. JWT verification stays ON; the endpoint accepts no
      # unauthenticated writes and only returns cleaned source lines.
      - name: Deploy Edge Function — ice-source-refine
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase_retry supabase functions deploy ice-source-refine \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --yes

      # The admin discovery-triage action calls this with the platform secret
      # key. JWT verification is off because new `sb_secret_` keys are not
      # JWTs; the function performs its own constant-time key check.
      - name: Deploy Edge Function — ice-discovery-triage
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase_retry supabase functions deploy ice-discovery-triage \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt \
            --yes

      # The nationwide scanner. pg_cron presents a new-style `sb_secret_` key
      # on `apikey`; those keys are not JWTs, so the function runs with
      # verify_jwt = false and performs its own constant-time key check.
      - name: Deploy Edge Function — ice-scan
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase_retry supabase functions deploy ice-scan \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt \
            --yes

      - name: Deploy Edge Function — walle-refresh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase_retry supabase functions deploy walle-refresh \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --yes

      # crm-broadcast-send is the one function the campaign composer cannot work
      # without: sendCRMBroadcast writes a `queued` row and dispatches here, so
      # the variable the app reads (CRM_BROADCAST_FUNCTION_URL) resolves to a
      # route that only exists once this step runs. It was absent from this
      # workflow while `secrets.manifest.mjs` marked RESEND_API_KEY and APP_URL
      # as required *for this function* — so the assertion below was checking
      # secrets for code nothing ever shipped, and production's composer failed
      # safely with "the broadcast sender is not configured on this deployment"
      # on every attempt.
      #
      # JWT verification stays ON. The only caller is an admin-gated server
      # action holding the service-role key, and this function moves real mail
      # to real people: an unauthenticated POST here must not reach Resend.
      - name: Deploy Edge Function — crm-broadcast-send
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase_retry supabase functions deploy crm-broadcast-send \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --yes

      - name: Deploy Edge Function — data-points
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase_retry supabase functions deploy data-points \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt \
            --yes

      # JWT verification stays ON. The only callers are pg_cron (which reads the
      # service key from Vault at run time) and an admin-gated server action.
      # The function writes rows into `events`, so an unauthenticated POST must
      # not reach it — this is why it gets the credentialed deploy rather than
      # the `--no-verify-jwt` shape the public read functions use.
      - name: Deploy Edge Function — sync-mobilize-events
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase_retry supabase functions deploy sync-mobilize-events \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --yes

      - name: Assert required edge secrets are set in the hosted project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # `supabase functions deploy` ships code only, so nothing in this
          # workflow has ever verified that the secrets the code reads actually
          # exist in the project. The live probes in the verify job all fail on a
          # validation or method check that runs BEFORE any secret is read, so a
          # missing RESEND_API_KEY deployed green and broke
          # silently for users at runtime. This is the gate that closes that.
          #
          # Platform-injected names (SUPABASE_URL, SUPABASE_ANON_KEY,
          # SUPABASE_SERVICE_ROLE_KEY) are absent from `secrets list` by design and
          # are therefore not required here.
          # Parsed as JSON rather than grepped. `supabase secrets list -o json`
          # emits compact JSON ("name":"X", no space after the colon), so a
          # `grep '"name": "X"'` pattern silently matches nothing and reports
          # every secret missing — which would fail this pipeline permanently.
          # Comparing parsed names is immune to the exact spacing.
          supabase secrets list --project-ref "$SUPABASE_PROJECT_REF" -o json > /tmp/secrets.json || {
            echo "::error::Could not read secrets list for project $SUPABASE_PROJECT_REF"
            echo "   Check SUPABASE_ACCESS_TOKEN (needs the 'secrets read' scope)."
            exit 1
          }

          bun -e "
            import { REQUIRED_IN_PROJECT } from './supabase/functions/secrets.manifest.mjs';
            const baseline = JSON.parse(require('node:fs').readFileSync('./scripts/secrets-baseline.json', 'utf8'));
            const accepted = new Set(
              Object.keys(baseline.accepted || {})
                .filter((k) => k.startsWith('required-missing:edge-secret:'))
                .map((k) => k.replace('required-missing:edge-secret:', ''))
            );
            const listed = JSON.parse(require('node:fs').readFileSync('/tmp/secrets.json', 'utf8'));
            const names = new Set(listed.map((s) => s.name));
            const missing = REQUIRED_IN_PROJECT.filter((n) => !names.has(n) && !accepted.has(n));
            console.log('Present:', [...names].sort().join(' ') || '(none)');
            if (accepted.size) console.log('Accepted in baseline:', [...accepted].sort().join(' '));
            if (missing.length) {
              console.error('::error::Required edge secret(s) not set in the hosted project:');
              for (const n of missing) console.error('  - ' + n);
              console.error('');
              console.error('   Set them with:');
              console.error('     supabase secrets set --project-ref ' + process.env.SUPABASE_PROJECT_REF + ' <NAME>=<VALUE>');
              console.error('   or Dashboard -> Project Settings -> Edge Functions -> Secrets.');
              process.exit(1);
            }
            console.log('All required edge secrets are present (or documented in baseline).');
          "

  # ── 2. Push migrations (independent job) ─────────────────────────────────
  # Deliberately NOT a dependency of verification: function delivery must be
  # verified even when migration push is blocked (e.g. missing DB secret),
  # and vice versa. Each job reports its own signal.
  migrate:
    name: Push database migrations
    runs-on: [self-hosted, linux]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate Supabase environment & credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_PROJECT_REF" || { echo "::error::SUPABASE_PROJECT_REF repository variable is missing"; exit 1; }
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::SUPABASE_ACCESS_TOKEN secret is missing"; exit 1; }

      - name: Install Supabase CLI
        run: |
          # Two mistakes here, both invisible until a job actually ran on this
          # fleet. It downloaded the **arm64** build onto an **X64** runner, and
          # it installed into root-owned /usr/local/bin while the job runs as the
          # unprivileged runner user — not fixable with sudo, because there is no
          # sudoers entry and deliberately so.
          #
          # `$HOME` is /home/runner and owned by uid 1001, so that is where this
          # goes. It is writable only because the entrypoint gives the runner user
          # a HOME of its own instead of leaving it pointing at /root.
          case "$(uname -s)" in
            Linux)  SUPA_OS=linux ;;
            Darwin) SUPA_OS=darwin ;;
            *) echo "::error::unsupported OS '$(uname -s)' for the supabase CLI"; exit 1 ;;
          esac
          case "$(uname -m)" in
            x86_64)        SUPA_ARCH=amd64 ;;
            aarch64|arm64) SUPA_ARCH=arm64 ;;
            *) echo "::error::unsupported architecture '$(uname -m)' for the supabase CLI"; exit 1 ;;
          esac
          BIN="$HOME/.local/bin"
          mkdir -p "$BIN"
          export PATH="$BIN:$PATH"
          echo "$BIN" >> "$GITHUB_PATH"

          # One source of truth: scripts/supabase-cli.mjs pins the version used
          # by `bun x`. Derive it here rather than writing 3.2.0 a second time.
          SUPABASE_CLI_VERSION="$(
            grep -oE "supabase@[0-9]+\.[0-9]+\.[0-9]+" scripts/supabase-cli.mjs \
              | head -n 1 | cut -d@ -f2
          )"
          test -n "$SUPABASE_CLI_VERSION" || {
            echo "::error::Could not read the pinned Supabase CLI version from scripts/supabase-cli.mjs"
            exit 1
          }

          TARBALL="supabase_${SUPABASE_CLI_VERSION}_${SUPA_OS}_${SUPA_ARCH}.tar.gz"
          RELEASE="https://github.com/supabase/cli/releases/download/v${SUPABASE_CLI_VERSION}"
          TMP="$(mktemp -d)"
          trap 'rm -rf "$TMP"' EXIT
          curl -fsSL "$RELEASE/checksums.txt" -o "$TMP/checksums.txt"
          curl -fsSL "$RELEASE/$TARBALL" -o "$TMP/$TARBALL"

          EXPECTED="$(awk -v f="$TARBALL" '$2 == f { print $1 }' "$TMP/checksums.txt")"
          test -n "$EXPECTED" || {
            echo "::error::No published checksum for $TARBALL"
            exit 1
          }
          if command -v sha256sum >/dev/null 2>&1; then
            ACTUAL="$(sha256sum "$TMP/$TARBALL" | awk '{print $1}')"
          else
            ACTUAL="$(shasum -a 256 "$TMP/$TARBALL" | awk '{print $1}')"
          fi
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Checksum mismatch for $TARBALL"
            echo "  expected: $EXPECTED"
            echo "  actual:   $ACTUAL"
            exit 1
          fi

          tar -xzf "$TMP/$TARBALL" -C "$BIN" supabase
          INSTALLED="$(supabase --version | head -n1 | tr -d '[:space:]')"
          if [ "$INSTALLED" != "$SUPABASE_CLI_VERSION" ]; then
            echo "::error::Supabase CLI version mismatch: expected $SUPABASE_CLI_VERSION, got $INSTALLED"
            exit 1
          fi
          echo "Supabase CLI $INSTALLED installed and verified."

      - name: Select DB route (diagnostic)
        # The direct DB host is IPv6-only (no A record). If the runner has
        # no IPv6 route, direct push can never work — fall back to a pooler
        # URL when provided, else fail with instructions. One binary signal:
        # route=direct|pooler ⇒ network OK (auth tested next); this step
        # red ⇒ network fault, credentials never even tried.
        id: route
        env:
          SUPABASE_POOLER_URL: ${{ secrets.SUPABASE_POOLER_URL }}
        run: |
          if timeout 10 bash -c "cat < /dev/null > /dev/tcp/db.${SUPABASE_PROJECT_REF}.supabase.co/5432"; then
            echo "✅ Direct DB reachable — pushing via project-ref"
            echo "route=direct" >> "$GITHUB_OUTPUT"
          elif [ -n "$SUPABASE_POOLER_URL" ]; then
            echo "Direct DB unreachable (IPv6-only host) — pushing via pooler --db-url"
            echo "route=pooler" >> "$GITHUB_OUTPUT"
          else
            # No CLI route — the Management-API applier below still converges
            # the schema, so warn (visible) instead of failing. route=none
            # skips the CLI steps via their `if:` gates.
            echo "::warning::Direct DB unreachable (host is IPv6-only, runner has no route) and SUPABASE_POOLER_URL is not set — CLI push skipped, Management-API applier takes over."
            echo "route=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Dry-run migration push (diagnostic)
        # Read-only: compares local vs remote history without applying.
        # dry-run ✓ + push ✗ ⇒ secret and network are fine, fault is
        # apply-phase migration state. dry-run ✗ ⇒ auth fault.
        # Skipped entirely when no CLI route exists (see route step).
        if: steps.route.outputs.route != 'none'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_POOLER_URL: ${{ secrets.SUPABASE_POOLER_URL }}
        run: |
          if [ "${{ steps.route.outputs.route }}" = "pooler" ]; then
            supabase db push --dry-run --db-url "$SUPABASE_POOLER_URL"
          else
            supabase db push --dry-run \
              --project-ref "$SUPABASE_PROJECT_REF" \
              --password "$SUPABASE_DB_PASSWORD"
          fi

      - name: Push Database Migrations
        # Skipped when no CLI route exists — the API applier below converges.
        if: steps.route.outputs.route != 'none'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_POOLER_URL: ${{ secrets.SUPABASE_POOLER_URL }}
        run: |
          if [ "${{ steps.route.outputs.route }}" = "pooler" ]; then
            supabase db push --db-url "$SUPABASE_POOLER_URL"
            exit 0
          fi
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::SUPABASE_DB_PASSWORD secret is not set — migrations cannot be pushed. Add it (Supabase dashboard → Project Settings → Database → database password) and re-run."
            exit 1
          fi
          supabase db push \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --password "$SUPABASE_DB_PASSWORD"

      - name: Setup bun (for API applier)
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Apply migrations via Management API (fallback)
        # Authoritative converger: runs whenever earlier steps are skipped
        # or soft-failed, no-ops when nothing is pending, hard-fails on any
        # real discrepancy. Runs on `always()` so a dead CLI route never
        # blocks schema delivery. Needs only HTTPS egress + the existing
        # SUPABASE_ACCESS_TOKEN.
        if: always()
        env:
          SUPABASE_PROJECT_REF: ${{ env.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: bun scripts/apply-migrations.mjs

  # ── 3. Generated TypeScript types ─────────────────────────────────────────
  # `src/types/supabase.ts` is generated from the live project, not from the
  # migration files. Comparing it before `migrate` would compare against the
  # schema *before* this push, so the check has to run after the migrations
  # above have been applied.
  #
  # This is deliberately a hard failure. A migration that lands while the
  # generated file still describes the old schema leaves the application
  # compiling against hand-written casts instead of the real columns, and a
  # green workflow makes that look intentional. If this job fails, run
  # `bun run types:generate` and push the regenerated file; that paths entry is
  # what makes this workflow run again for the fix.
  types:
    name: Generated types freshness
    runs-on: [self-hosted, linux]
    needs: [migrate]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # `--require-token` is the CI-only half of the wrapper: locally a missing
      # token is a skip, but here it is a configuration fault that must not be
      # mistaken for fresh types.
      #
      # Prefer the project-scoped Database Read PAT; the fallback keeps this job
      # working until that optional secret is provisioned.
      - name: Compare generated types with the live schema
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_READ_ONLY_ACCESS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
        run: bun scripts/check-supabase-types.mjs --require-token

  # ── 4. Install the schedule and prove the scanner runs ────────────────────
  # The function and the migration are both prerequisites: the function uses
  # the run/lease tables, and the schedule calls the function. This job is the
  # only place that writes Vault secrets, so a deployment can never leave a
  # schedule pointing at an empty credential again.
  schedule:
    name: Install ICE scan schedule
    needs: [deploy, migrate]
    runs-on: [self-hosted, linux]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install Vault secrets and pg_cron jobs
        env:
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
        run: bun scripts/seed-ice-alert-cron.mjs

      - name: Trigger one scan and verify Supabase health
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: bun scripts/check-ice-scan-health.mjs --trigger --require-runs --max-age-min 60

  # ── 5. Post-deploy verification (fail loudly if a function is missing) ─────
  verify:
    name: Verify live edge functions
    runs-on: [self-hosted, linux]
    needs: [deploy]
    timeout-minutes: 10
    steps:
      - name: Validate Edge Function URL & Publishable Key
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:
            ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_URL" || { echo "::error::NEXT_PUBLIC_SUPABASE_URL variable is missing"; exit 1; }
          test -n "$NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY" || { echo "::error::NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY variable is missing"; exit 1; }

      - name: Probe health edge function
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:
            ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          EDGE_BASE="${NEXT_PUBLIC_SUPABASE_URL}/functions/v1"
          AUTH_HEADER="Authorization: Bearer ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}"
          APIKEY_HEADER="apikey: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}"

          echo "Allowing 5s for Edge gateway route propagation..."
          sleep 5

          echo "Probing $EDGE_BASE/health ..."
          STATUS=$(curl -s -o /tmp/health.json -w '%{http_code}' \
            --retry 5 --retry-delay 2 --retry-connrefused \
            -H "$AUTH_HEADER" -H "$APIKEY_HEADER" \
            "$EDGE_BASE/health" || echo 000)
          cat /tmp/health.json || true
          echo "health → HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::error::health edge function is not ready (HTTP $STATUS)"
            exit 1
          fi

          check_post() {
            local name="$1"
            local expected="$2"
            local body="$3"
            local code
            if [ -n "$body" ]; then
              code=$(curl -s -o /dev/null -w '%{http_code}' \
                --retry 5 --retry-delay 2 --retry-connrefused \
                -X POST \
                -H "$AUTH_HEADER" -H "$APIKEY_HEADER" -H 'Content-Type: application/json' \
                -d "$body" "$EDGE_BASE/$name" || echo 000)
            else
              code=$(curl -s -o /dev/null -w '%{http_code}' \
                --retry 5 --retry-delay 2 --retry-connrefused \
                -X POST \
                -H "$AUTH_HEADER" -H "$APIKEY_HEADER" -H 'Content-Type: application/json' \
                "$EDGE_BASE/$name" || echo 000)
            fi
            echo "$name → HTTP $code"
            if [ "$expected" = "400|401" ]; then
              if [ "$code" != "400" ] && [ "$code" != "401" ]; then
                echo "::error::$name returned unexpected HTTP $code"
                exit 1
              fi
            elif [ "$code" != "$expected" ]; then
              echo "::error::$name returned unexpected HTTP $code (expected $expected)"
              exit 1
            fi
          }

          check_get() {
            local name="$1"
            local code
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              --retry 5 --retry-delay 2 --retry-connrefused \
              -H "$AUTH_HEADER" -H "$APIKEY_HEADER" \
              "$EDGE_BASE/$name" || echo 000)
            echo "$name → HTTP $code (GET)"
            if [ "$code" != "405" ]; then
              echo "::error::$name returned unexpected HTTP $code (expected 405)"
              exit 1
            fi
          }

          check_post notify-contact 400 '{}'
          check_post search 400 '{"q":""}'

          # The broadcast sender is probed with the *publishable* key, not the
          # service-role key, and the expectation is a rejection. That is the
          # assertion: a 401 here proves the route exists, is reachable, and
          # refuses an unauthenticated caller. A 404 would mean the function was
          # not deployed (the exact failure this probe exists to catch); a 200
          # would mean it has stopped requiring a key, which is worse.
          #
          # The publishable key is deliberately *not* the service-role key. Using
          # a real credential here would let a probe that sends a malformed
          # broadcast reach the recipient-resolution path.
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            --retry 5 --retry-delay 2 --retry-connrefused \
            -X POST \
            -H "$AUTH_HEADER" -H "$APIKEY_HEADER" -H 'Content-Type: application/json' \
            -d '{}' "$EDGE_BASE/crm-broadcast-send" || echo 000)
          echo "crm-broadcast-send → HTTP $code (unauthenticated POST)"
          if [ "$code" != "401" ]; then
            echo "::error::crm-broadcast-send returned HTTP $code — expected 401. A 404 means the function is not deployed; a 200 means it stopped requiring the service key."
            exit 1
          fi

          check_get wall-e-chat
          check_get ice-case-brief
          check_get ice-source-refine
          check_post ice-discovery-triage 401 '{}'
          check_get ice-scan
          check_get walle-refresh

          # Issue #153: same assertion shape as crm-broadcast-send. The publishable
          # key is not the service key, so a 401 proves the route exists, is
          # reachable, and still refuses an unauthenticated caller. A 404 means
          # the deploy step above did not ship it; a 200 means it stopped
          # requiring a key, which would let anyone trigger a write into `events`.
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            --retry 5 --retry-delay 2 --retry-connrefused \
            -X POST \
            -H "$AUTH_HEADER" -H "$APIKEY_HEADER" -H 'Content-Type: application/json' \
            -d '{"force":true}' "$EDGE_BASE/sync-mobilize-events" || echo 000)
          echo "sync-mobilize-events → HTTP $code (unauthenticated POST)"
          if [ "$code" != "401" ]; then
            echo "::error::sync-mobilize-events returned HTTP $code — expected 401. A 404 means the function is not deployed; a 200 means it stopped requiring the service key."
            exit 1
          fi

          echo "Probing $EDGE_BASE/data-points ..."
          DP_STATUS=$(curl -s -o /tmp/dp.json -w '%{http_code}' \
            --retry 5 --retry-delay 2 --retry-connrefused \
            -H "$AUTH_HEADER" -H "$APIKEY_HEADER" \
            "$EDGE_BASE/data-points?group=home" || echo 000)
          echo "data-points → HTTP $DP_STATUS"
          if [ "$DP_STATUS" != "200" ]; then
            echo "::error::data-points edge function is not ready (HTTP $DP_STATUS)"
            exit 1
          fi

          echo "✅ All edge functions answering (project $SUPABASE_PROJECT_REF)"
