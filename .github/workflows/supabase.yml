name: Supabase

# ── Dedicated Supabase delivery workflow ─────────────────────────────────────
# ALL Supabase-project delivery (edge functions + migrations + post-deploy
# verification) lives HERE — never in ci.yml. Canonical project:
# https://supabase.com/dashboard/project/mojsubkqjdruhpxbzgme/
#
# Triggers:
#   - push to main touching supabase/** or this workflow
#   - manual dispatch (e.g. redeploy after a secret rotation)
#
# Runners: backend-runner ONLY ([self-hosted, linux, backend-runner]).
# Frontend jobs must never land here; see ci.yml (frontend-runner).

on:
  push:
    # `mainDeploy` has no remote ref; see the note in ci.yml. Removed
    # 2026-10-06.
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase.yml'
  workflow_dispatch:

concurrency:
  # Never auto-cancel a migration push mid-flight — a partial apply is worse
  # than a queued run. Simultaneous pushes serialize here instead.
  group: supabase-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Public Supabase identity. Kept in the variables store so all Supabase
  # configuration lives in one place and can be changed without a code review.
  SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  # Pinned bun for the Management-API applier — same line as ci.yml.
  BUN_VERSION: "1.4.2"

jobs:
  # ── 1. Deploy all edge functions ─────────────────────────────────────────
  deploy:
    name: Deploy edge functions
    runs-on: [self-hosted, linux, backend-runner]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6

      - name: Type-check Edge Functions
        run: deno check --config supabase/functions/deno.json supabase/functions/*/index.ts

      - name: Install Supabase CLI
        run: |
          # Two mistakes here, both invisible until a job actually ran on this
          # fleet. It downloaded the **arm64** build onto an **X64** runner, and
          # it installed into root-owned /usr/local/bin while the job runs as the
          # unprivileged runner user — not fixable with sudo, because there is no
          # sudoers entry and deliberately so.
          #
          # `$HOME` is /home/runner and owned by uid 1001, so that is where this
          # goes. It is writable only because the entrypoint gives the runner user
          # a HOME of its own instead of leaving it pointing at /root.
          case "$(uname -m)" in
            x86_64)        SUPA_ARCH=amd64 ;;
            aarch64|arm64) SUPA_ARCH=arm64 ;;
            *) echo "::error::unsupported architecture '$(uname -m)' for the supabase CLI"; exit 1 ;;
          esac
          BIN="$HOME/.local/bin"
          mkdir -p "$BIN"
          export PATH="$BIN:$PATH"
          echo "$BIN" >> "$GITHUB_PATH"
          if ! command -v supabase &>/dev/null; then
            curl -fsSL "https://github.com/supabase/cli/releases/latest/download/supabase_linux_${SUPA_ARCH}.tar.gz" \
              | tar -xz -C "$BIN" supabase
          fi
          supabase --version

      - name: Deploy Edge Function — notify-contact
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy notify-contact \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt

      - name: Deploy Edge Function — checkout
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy checkout \
            --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy Edge Function — search
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy search \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt

      - name: Deploy Edge Function — webhook
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy webhook \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt

      - name: Deploy Edge Function — health
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy health \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt

      # NOTE: wall-e-chat / walle-refresh keep gateway JWT verification ON
      # (no --no-verify-jwt). Callers present a valid key: the Next.js proxy
      # uses the publishable key, ops callers use the service-role key.
      - name: Deploy Edge Function — wall-e-chat
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy wall-e-chat \
            --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy Edge Function — walle-refresh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy walle-refresh \
            --project-ref "$SUPABASE_PROJECT_REF"

      # crm-broadcast-send is the one function the campaign composer cannot work
      # without: sendCRMBroadcast writes a `queued` row and dispatches here, so
      # the variable the app reads (CRM_BROADCAST_FUNCTION_URL) resolves to a
      # route that only exists once this step runs. It was absent from this
      # workflow while `secrets.manifest.mjs` marked RESEND_API_KEY and APP_URL
      # as required *for this function* — so the assertion below was checking
      # secrets for code nothing ever shipped, and production's composer failed
      # safely with "the broadcast sender is not configured on this deployment"
      # on every attempt.
      #
      # JWT verification stays ON. The only caller is an admin-gated server
      # action holding the service-role key, and this function moves real mail
      # to real people: an unauthenticated POST here must not reach Resend.
      - name: Deploy Edge Function — crm-broadcast-send
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy crm-broadcast-send \
            --project-ref "$SUPABASE_PROJECT_REF"

      - name: Assert required edge secrets are set in the hosted project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # `supabase functions deploy` ships code only, so nothing in this
          # workflow has ever verified that the secrets the code reads actually
          # exist in the project. The live probes in the verify job all fail on a
          # validation or method check that runs BEFORE any secret is read, so a
          # missing STRIPE_SECRET_KEY or RESEND_API_KEY deployed green and broke
          # silently for users at runtime. This is the gate that closes that.
          #
          # Platform-injected names (SUPABASE_URL, SUPABASE_ANON_KEY,
          # SUPABASE_SERVICE_ROLE_KEY) are absent from `secrets list` by design and
          # are therefore not required here.
          # Parsed as JSON rather than grepped. `supabase secrets list -o json`
          # emits compact JSON ("name":"X", no space after the colon), so a
          # `grep '"name": "X"'` pattern silently matches nothing and reports
          # every secret missing — which would fail this pipeline permanently.
          # Comparing parsed names is immune to the exact spacing.
          supabase secrets list --project-ref "$SUPABASE_PROJECT_REF" -o json > /tmp/secrets.json || {
            echo "::error::Could not read secrets list for project $SUPABASE_PROJECT_REF"
            echo "   Check SUPABASE_ACCESS_TOKEN (needs the 'secrets read' scope)."
            exit 1
          }

          bun -e "
            import { REQUIRED_IN_PROJECT } from './supabase/functions/secrets.manifest.mjs';
            const listed = JSON.parse(require('node:fs').readFileSync('/tmp/secrets.json', 'utf8'));
            const names = new Set(listed.map((s) => s.name));
            const missing = REQUIRED_IN_PROJECT.filter((n) => !names.has(n));
            console.log('Present:', [...names].sort().join(' ') || '(none)');
            if (missing.length) {
              console.error('::error::Required edge secret(s) not set in the hosted project:');
              for (const n of missing) console.error('  - ' + n);
              console.error('');
              console.error('   Set them with:');
              console.error('     supabase secrets set --project-ref ' + process.env.SUPABASE_PROJECT_REF + ' <NAME>=<VALUE>');
              console.error('   or Dashboard -> Project Settings -> Edge Functions -> Secrets.');
              process.exit(1);
            }
            console.log('All required edge secrets are present.');
          "

  # ── 2. Push migrations (independent job) ─────────────────────────────────
  # Deliberately NOT a dependency of verification: function delivery must be
  # verified even when migration push is blocked (e.g. missing DB secret),
  # and vice versa. Each job reports its own signal.
  migrate:
    name: Push database migrations
    runs-on: [self-hosted, linux, backend-runner]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Supabase CLI
        run: |
          # Two mistakes here, both invisible until a job actually ran on this
          # fleet. It downloaded the **arm64** build onto an **X64** runner, and
          # it installed into root-owned /usr/local/bin while the job runs as the
          # unprivileged runner user — not fixable with sudo, because there is no
          # sudoers entry and deliberately so.
          #
          # `$HOME` is /home/runner and owned by uid 1001, so that is where this
          # goes. It is writable only because the entrypoint gives the runner user
          # a HOME of its own instead of leaving it pointing at /root.
          case "$(uname -m)" in
            x86_64)        SUPA_ARCH=amd64 ;;
            aarch64|arm64) SUPA_ARCH=arm64 ;;
            *) echo "::error::unsupported architecture '$(uname -m)' for the supabase CLI"; exit 1 ;;
          esac
          BIN="$HOME/.local/bin"
          mkdir -p "$BIN"
          export PATH="$BIN:$PATH"
          echo "$BIN" >> "$GITHUB_PATH"
          if ! command -v supabase &>/dev/null; then
            curl -fsSL "https://github.com/supabase/cli/releases/latest/download/supabase_linux_${SUPA_ARCH}.tar.gz" \
              | tar -xz -C "$BIN" supabase
          fi
          supabase --version

      - name: Select DB route (diagnostic)
        # The direct DB host is IPv6-only (no A record). If the runner has
        # no IPv6 route, direct push can never work — fall back to a pooler
        # URL when provided, else fail with instructions. One binary signal:
        # route=direct|pooler ⇒ network OK (auth tested next); this step
        # red ⇒ network fault, credentials never even tried.
        id: route
        env:
          SUPABASE_POOLER_URL: ${{ secrets.SUPABASE_POOLER_URL }}
        run: |
          if timeout 10 bash -c "cat < /dev/null > /dev/tcp/db.${SUPABASE_PROJECT_REF}.supabase.co/5432"; then
            echo "✅ Direct DB reachable — pushing via project-ref"
            echo "route=direct" >> "$GITHUB_OUTPUT"
          elif [ -n "$SUPABASE_POOLER_URL" ]; then
            echo "Direct DB unreachable (IPv6-only host) — pushing via pooler --db-url"
            echo "route=pooler" >> "$GITHUB_OUTPUT"
          else
            # No CLI route — the Management-API applier below still converges
            # the schema, so warn (visible) instead of failing. route=none
            # skips the CLI steps via their `if:` gates.
            echo "::warning::Direct DB unreachable (host is IPv6-only, runner has no route) and SUPABASE_POOLER_URL is not set — CLI push skipped, Management-API applier takes over."
            echo "route=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Dry-run migration push (diagnostic)
        # Read-only: compares local vs remote history without applying.
        # dry-run ✓ + push ✗ ⇒ secret and network are fine, fault is
        # apply-phase migration state. dry-run ✗ ⇒ auth fault.
        # Skipped entirely when no CLI route exists (see route step).
        if: steps.route.outputs.route != 'none'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_POOLER_URL: ${{ secrets.SUPABASE_POOLER_URL }}
        run: |
          if [ "${{ steps.route.outputs.route }}" = "pooler" ]; then
            supabase db push --dry-run --db-url "$SUPABASE_POOLER_URL"
          else
            supabase db push --dry-run \
              --project-ref "$SUPABASE_PROJECT_REF" \
              --password "$SUPABASE_DB_PASSWORD"
          fi

      - name: Push Database Migrations
        # Skipped when no CLI route exists — the API applier below converges.
        if: steps.route.outputs.route != 'none'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_POOLER_URL: ${{ secrets.SUPABASE_POOLER_URL }}
        run: |
          if [ "${{ steps.route.outputs.route }}" = "pooler" ]; then
            supabase db push --db-url "$SUPABASE_POOLER_URL"
            exit 0
          fi
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::SUPABASE_DB_PASSWORD secret is not set — migrations cannot be pushed. Add it (Supabase dashboard → Project Settings → Database → database password) and re-run."
            exit 1
          fi
          supabase db push \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --password "$SUPABASE_DB_PASSWORD"

      - name: Setup bun (for API applier)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Apply migrations via Management API (fallback)
        # Authoritative converger: runs whenever earlier steps are skipped
        # or soft-failed, no-ops when nothing is pending, hard-fails on any
        # real discrepancy. Runs on `always()` so a dead CLI route never
        # blocks schema delivery. Needs only HTTPS egress + the existing
        # SUPABASE_ACCESS_TOKEN.
        if: always()
        env:
          SUPABASE_PROJECT_REF: ${{ env.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: bun scripts/apply-migrations.mjs

  # ── 3. Post-deploy verification (fail loudly if a function is missing) ─────
  verify:
    name: Verify live edge functions
    runs-on: [self-hosted, linux, backend-runner]
    needs: [deploy]
    timeout-minutes: 10
    steps:
      - name: Probe health edge function
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:
            ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          EDGE_BASE="${NEXT_PUBLIC_SUPABASE_URL}/functions/v1"
          AUTH_HEADER="Authorization: Bearer ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}"
          APIKEY_HEADER="apikey: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}"

          echo "Probing $EDGE_BASE/health ..."
          STATUS=$(curl -s -o /tmp/health.json -w '%{http_code}' \
            -H "$AUTH_HEADER" -H "$APIKEY_HEADER" \
            "$EDGE_BASE/health" || echo 000)
          cat /tmp/health.json || true
          echo "health → HTTP $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "::error::health edge function is not ready (HTTP $STATUS)"
            exit 1
          fi

          check_post() {
            local name="$1"
            local expected="$2"
            local body="$3"
            local code
            if [ -n "$body" ]; then
              code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
                -H "$AUTH_HEADER" -H "$APIKEY_HEADER" -H 'Content-Type: application/json' \
                -d "$body" "$EDGE_BASE/$name" || echo 000)
            else
              code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
                -H "$AUTH_HEADER" -H "$APIKEY_HEADER" -H 'Content-Type: application/json' \
                "$EDGE_BASE/$name" || echo 000)
            fi
            echo "$name → HTTP $code"
            if [ "$expected" = "400|401" ]; then
              if [ "$code" != "400" ] && [ "$code" != "401" ]; then
                echo "::error::$name returned unexpected HTTP $code"
                exit 1
              fi
            elif [ "$code" != "$expected" ]; then
              echo "::error::$name returned unexpected HTTP $code (expected $expected)"
              exit 1
            fi
          }

          check_get() {
            local name="$1"
            local code
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "$AUTH_HEADER" -H "$APIKEY_HEADER" \
              "$EDGE_BASE/$name" || echo 000)
            echo "$name → HTTP $code (GET)"
            if [ "$code" != "405" ]; then
              echo "::error::$name returned unexpected HTTP $code (expected 405)"
              exit 1
            fi
          }

          check_post notify-contact 400 '{}'
          check_post search 400 '{"q":""}'
          check_post checkout '400|401' '{}'
          check_post webhook 400 ''

          # The broadcast sender is probed with the *publishable* key, not the
          # service-role key, and the expectation is a rejection. That is the
          # assertion: a 401 here proves the route exists, is reachable, and
          # refuses an unauthenticated caller. A 404 would mean the function was
          # not deployed (the exact failure this probe exists to catch); a 200
          # would mean it has stopped requiring a key, which is worse.
          #
          # The publishable key is deliberately *not* the service-role key. Using
          # a real credential here would let a probe that sends a malformed
          # broadcast reach the recipient-resolution path.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H "$AUTH_HEADER" -H "$APIKEY_HEADER" -H 'Content-Type: application/json' \
            -d '{}' "$EDGE_BASE/crm-broadcast-send" || echo 000)
          echo "crm-broadcast-send → HTTP $code (unauthenticated POST)"
          if [ "$code" != "401" ]; then
            echo "::error::crm-broadcast-send returned HTTP $code — expected 401. A 404 means the function is not deployed; a 200 means it stopped requiring the service key."
            exit 1
          fi

          check_get wall-e-chat
          check_get walle-refresh
          echo "✅ All edge functions answering (project $SUPABASE_PROJECT_REF)"
