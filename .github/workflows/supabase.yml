name: Supabase

# ── Dedicated Supabase delivery workflow ─────────────────────────────────────
# ALL Supabase-project delivery (edge functions + migrations + post-deploy
# verification) lives HERE — never in ci.yml. Canonical project:
# https://supabase.com/dashboard/project/mojsubkqjdruhpxbzgme/
#
# Triggers:
#   - push to main/mainDeploy touching supabase/** or this workflow
#   - manual dispatch (e.g. redeploy after a secret rotation)
#
# Runners: backend-runner ONLY ([self-hosted, linux, ARM64, backend-runner]).
# Frontend jobs must never land here; see ci.yml (frontend-runner).

on:
  push:
    branches: [main, mainDeploy]
    paths:
      - 'supabase/**'
      - '.github/workflows/supabase.yml'
  workflow_dispatch:

concurrency:
  # Never auto-cancel a migration push mid-flight — a partial apply is worse
  # than a queued run. Simultaneous pushes serialize here instead.
  group: supabase-${{ github.ref }}
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: mojsubkqjdruhpxbzgme
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  # Pinned bun for the Management-API applier — same line as ci.yml.
  BUN_VERSION: "1.4.2"

jobs:
  # ── 1. Deploy all edge functions ─────────────────────────────────────────
  deploy:
    name: Deploy edge functions
    runs-on: [self-hosted, linux, ARM64, backend-runner]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6

      - name: Type-check Edge Functions
        run: deno check --node-modules-dir=auto supabase/functions/*/index.ts

      - name: Install Supabase CLI
        run: |
          if ! command -v supabase &>/dev/null; then
            curl -fsSL https://github.com/supabase/cli/releases/latest/download/supabase_linux_arm64.tar.gz \
              | tar -xz -C /usr/local/bin supabase
          fi
          supabase --version

      - name: Deploy Edge Function — notify-contact
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy notify-contact \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt

      - name: Deploy Edge Function — checkout
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy checkout \
            --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy Edge Function — search
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy search \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt

      - name: Deploy Edge Function — webhook
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy webhook \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt

      - name: Deploy Edge Function — health
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy health \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt

      # NOTE: wall-e-chat / walle-refresh keep gateway JWT verification ON
      # (no --no-verify-jwt). Callers present a valid key: the Next.js proxy
      # uses the publishable key, ops callers use the service-role key.
      - name: Deploy Edge Function — wall-e-chat
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy wall-e-chat \
            --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy Edge Function — walle-refresh
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy walle-refresh \
            --project-ref "$SUPABASE_PROJECT_REF"

  # ── 2. Push migrations (independent job) ─────────────────────────────────
  # Deliberately NOT a dependency of verification: function delivery must be
  # verified even when migration push is blocked (e.g. missing DB secret),
  # and vice versa. Each job reports its own signal.
  migrate:
    name: Push database migrations
    runs-on: [self-hosted, linux, ARM64, backend-runner]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        run: |
          if ! command -v supabase &>/dev/null; then
            curl -fsSL https://github.com/supabase/cli/releases/latest/download/supabase_linux_arm64.tar.gz \
              | tar -xz -C /usr/local/bin supabase
          fi
          supabase --version

      - name: Select DB route (diagnostic)
        # The direct DB host is IPv6-only (no A record). If the runner has
        # no IPv6 route, direct push can never work — fall back to a pooler
        # URL when provided, else fail with instructions. One binary signal:
        # route=direct|pooler ⇒ network OK (auth tested next); this step
        # red ⇒ network fault, credentials never even tried.
        id: route
        env:
          SUPABASE_POOLER_URL: ${{ secrets.SUPABASE_POOLER_URL }}
        run: |
          if timeout 10 bash -c "cat < /dev/null > /dev/tcp/db.${SUPABASE_PROJECT_REF}.supabase.co/5432"; then
            echo "✅ Direct DB reachable — pushing via project-ref"
            echo "route=direct" >> "$GITHUB_OUTPUT"
          elif [ -n "$SUPABASE_POOLER_URL" ]; then
            echo "Direct DB unreachable (IPv6-only host) — pushing via pooler --db-url"
            echo "route=pooler" >> "$GITHUB_OUTPUT"
          else
            # No CLI route — the Management-API applier below still converges
            # the schema, so warn (visible) instead of failing. route=none
            # skips the CLI steps via their `if:` gates.
            echo "::warning::Direct DB unreachable (host is IPv6-only, runner has no route) and SUPABASE_POOLER_URL is not set — CLI push skipped, Management-API applier takes over."
            echo "route=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Dry-run migration push (diagnostic)
        # Read-only: compares local vs remote history without applying.
        # dry-run ✓ + push ✗ ⇒ secret and network are fine, fault is
        # apply-phase migration state. dry-run ✗ ⇒ auth fault.
        # Skipped entirely when no CLI route exists (see route step).
        if: steps.route.outputs.route != 'none'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_POOLER_URL: ${{ secrets.SUPABASE_POOLER_URL }}
        run: |
          if [ "${{ steps.route.outputs.route }}" = "pooler" ]; then
            supabase db push --dry-run --db-url "$SUPABASE_POOLER_URL"
          else
            supabase db push --dry-run \
              --project-ref "$SUPABASE_PROJECT_REF" \
              --password "$SUPABASE_DB_PASSWORD"
          fi

      - name: Push Database Migrations
        # Skipped when no CLI route exists — the API applier below converges.
        if: steps.route.outputs.route != 'none'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_POOLER_URL: ${{ secrets.SUPABASE_POOLER_URL }}
        run: |
          if [ "${{ steps.route.outputs.route }}" = "pooler" ]; then
            supabase db push --db-url "$SUPABASE_POOLER_URL"
            exit 0
          fi
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::SUPABASE_DB_PASSWORD secret is not set — migrations cannot be pushed. Add it (Supabase dashboard → Project Settings → Database → database password) and re-run."
            exit 1
          fi
          supabase db push \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --password "$SUPABASE_DB_PASSWORD"

      - name: Setup bun (for API applier)
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Apply migrations via Management API (fallback)
        # Authoritative converger: runs whenever earlier steps are skipped
        # or soft-failed, no-ops when nothing is pending, hard-fails on any
        # real discrepancy. Runs on `always()` so a dead CLI route never
        # blocks schema delivery. Needs only HTTPS egress + the existing
        # SUPABASE_ACCESS_TOKEN.
        if: always()
        env:
          SUPABASE_PROJECT_REF: ${{ env.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: bun scripts/apply-migrations.mjs

  # ── 3. Post-deploy verification (fail loudly if a function is missing) ─────
  verify:
    name: Verify live edge functions
    runs-on: [self-hosted, linux, ARM64, backend-runner]
    needs: [deploy]
    timeout-minutes: 10
    steps:
      - name: Probe health edge function
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:
            ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          EDGE_BASE="${NEXT_PUBLIC_SUPABASE_URL}/functions/v1"
          AUTH_HEADER="Authorization: Bearer ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}"
          APIKEY_HEADER="apikey: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}"

          echo "Probing $EDGE_BASE/health ..."
          STATUS=$(curl -s -o /tmp/health.json -w '%{http_code}' \
            -H "$AUTH_HEADER" -H "$APIKEY_HEADER" \
            "$EDGE_BASE/health" || echo 000)
          cat /tmp/health.json || true
          echo "health → HTTP $STATUS"
          if [ "$STATUS" = "404" ]; then
            echo "::error::health edge function missing (HTTP 404) — deploy failed"
            exit 1
          fi
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "503" ]; then
            echo "::error::health edge function unexpected HTTP $STATUS"
            exit 1
          fi

          # Each function must answer its validation path (4xx = alive,
          # 404 = not deployed). Any 404 fails the workflow.
          for FN in "notify-contact:{}" "search:{\"q\":\"\"}" "checkout:{}" "webhook:"; do
            NAME="${FN%%:*}"
            BODY="${FN#*:}"
            if [ -z "$BODY" ]; then
              CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
                -H "$AUTH_HEADER" -H "$APIKEY_HEADER" -H 'Content-Type: application/json' \
                "$EDGE_BASE/$NAME" || echo 000)
            else
              CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
                -H "$AUTH_HEADER" -H "$APIKEY_HEADER" -H 'Content-Type: application/json' \
                -d "$BODY" "$EDGE_BASE/$NAME" || echo 000)
            fi
            echo "$NAME → HTTP $CODE"
            if [ "$CODE" = "404" ]; then
              echo "::error::$NAME edge function missing (HTTP 404) — deploy failed"
              exit 1
            fi
          done
          # wall-e-chat + walle-refresh reject non-POST with 405 (alive) —
          # never POST here: wall-e-chat would spend an AI call, walle-refresh
          # would rewrite snapshots. GET 404 = not deployed.
          for FN in wall-e-chat walle-refresh; do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "$AUTH_HEADER" -H "$APIKEY_HEADER" \
              "$EDGE_BASE/$FN" || echo 000)
            echo "$FN → HTTP $CODE (GET)"
            if [ "$CODE" = "404" ]; then
              echo "::error::$FN edge function missing (HTTP 404) — deploy failed"
              exit 1
            fi
          done
          echo "✅ All edge functions answering (project $SUPABASE_PROJECT_REF)"
