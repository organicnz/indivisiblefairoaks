name: Schema checks (trusted)

# The authoritative schema gate, split by what each half can honestly answer.
#
# `pull_request_target` runs the **tokenless** half. It validates the merged
# migration set (base tip + PR head) with base-branch scripts and reads only
# the merge ref's `supabase/migrations` directory as data. It needs no Supabase
# credential, no network and no database, so a PR cannot go red because the
# hosted project is behind, and a fork PR is checked exactly like a same-repo
# PR. It is deliberately not named "Migration History": it never speaks for the
# hosted catalogue.
#
# The **hosted** half describes the live catalogue, so it cannot run before the
# migrations are applied. It is triggered by the `Supabase` workflow completing
# on `main` instead of by `push`, so the two workflows cannot race: the check
# starts only after this commit's migrations have been applied. A failed
# Supabase run leaves the hosted check unrun and red, which is the signal we
# want — a migration that could not be applied is not a green schema.
#
# Neither job executes PR code next to a secret. The tokenless job copies
# migrations only; the hosted job runs the default branch's own scripts at the
# commit Supabase just migrated.
#
# `src/lib/__tests__/ci-schema-check-conditions.test.ts` pins the split, the
# event coverage, the merged-migration copy, the ordering and the credential
# boundary.
on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_run:
    workflows: [Supabase]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: schema-trusted-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

env:
  BUN_VERSION: "canary"

jobs:
  # ── PR time: tokenless ────────────────────────────────────────────────────
  # The merge tree's migrations: base tip plus the PR head. The sparse
  # checkout keeps the fork's source, workflows and scripts off the disk
  # entirely; this directory is data for the copy step and nothing else.
  schema-pr:
    name: Schema checks (PR, trusted)
    if: github.event_name == 'pull_request_target'
    runs-on: [self-hosted, linux, backend-runner]
    timeout-minutes: 10
    defaults:
      run:
        working-directory: trusted
    steps:
      - name: Checkout merge migrations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ format('refs/pull/{0}/merge', github.event.pull_request.number) }}
          path: pr
          sparse-checkout: supabase/migrations
          persist-credentials: false
          # Required for a fork's merge ref under `pull_request_target`.
          # The checkout is data-only: sparse migrations, no PR script run.
          allow-unsafe-pr-checkout: true

      # The base commit: the exact code already reviewed and merged. Every
      # process runs from here. A PR cannot rewrite the checker.
      - name: Checkout trusted base scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false

      # Copy only the migration directory into the trusted checkout. The source
      # and destination are fixed workspace paths; this step executes no PR
      # code and receives no token. Base migrations stay untouched so the
      # immutability and SQL checks still compare against a real base.
      - name: Copy only migrations into trusted checkout
        id: copy_migrations
        working-directory: .
        run: |
          SOURCE="$GITHUB_WORKSPACE/pr/supabase/migrations"
          DEST="$GITHUB_WORKSPACE/trusted/pr-migrations"
          # A symlink here could make a trusted checker read a file outside the
          # migration set (for example, the process environment later in this
          # job). Migrations are regular files; refuse anything else.
          if [ -L "$SOURCE" ] || [ ! -d "$SOURCE" ]; then
            echo "::error::PR migrations are not a real directory; refusing to read them."
            exit 1
          fi
          NON_FILES="$(find "$SOURCE" -mindepth 1 ! -type f -print -quit)" || {
            echo "::error::Could not inspect PR migrations; refusing to read them."
            exit 1
          }
          if [ -n "$NON_FILES" ]; then
            echo "::error::PR migrations contain a symbolic link or special file; refusing to read it."
            exit 1
          fi
          rm -rf "$DEST"
          cp -R "$SOURCE" "$DEST"
          if [ -L "$DEST" ] || [ ! -d "$DEST" ]; then
            echo "::error::Copied migrations are not a real directory; refusing to read them."
            exit 1
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
          no-cache: true

      # Deliberately no `bun install`: these scripts are stdlib imports.
      # Neither step below receives a Supabase credential.
      #
      # Applied migrations are immutable, and a version check cannot see an
      # edit: `schema_migrations` records a version, not the file. This compares
      # the merged migration set against the trusted base byte-for-byte, so a
      # modified, renamed or deleted merged migration fails.
      - name: Check applied migrations are immutable
        if: always() && steps.copy_migrations.outcome == 'success'
        env:
          MIGRATIONS_DIR: ${{ github.workspace }}/trusted/pr-migrations
          BASE_MIGRATIONS_DIR: ${{ github.workspace }}/trusted/supabase/migrations
        run: bun scripts/check-migration-immutability.mjs

      # Static SQL validation for the migrations this change adds or edits. No
      # database: comments, strings and dollar-quoted bodies are stripped, then
      # each statement is checked for structural breakage and for statements
      # that destroy data. A migration that must destroy something opts out in
      # the file with `-- allow-destructive: <reason>`.
      - name: Validate changed migration SQL
        if: always() && steps.copy_migrations.outcome == 'success'
        env:
          MIGRATIONS_DIR: ${{ github.workspace }}/trusted/pr-migrations
          BASE_MIGRATIONS_DIR: ${{ github.workspace }}/trusted/supabase/migrations
        run: bun scripts/check-migration-sql.mjs

  # ── After the migrations land: hosted ─────────────────────────────────────
  # Runs only when the `Supabase` workflow finished successfully on `main`,
  # against the exact commit it migrated. This is what makes the gate
  # deterministic: it can no longer read the catalogue while another change is
  # mid-apply, and it no longer runs at all on a push that has not applied yet.
  schema:
    name: Migration History
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, linux, backend-runner]
    timeout-minutes: 10
    steps:
      - name: Checkout migrated commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # `github.sha` on a workflow_run is the default branch tip, which may
          # already be past the commit Supabase migrated. Use the run's own SHA.
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
          no-cache: true

      # A missing token is not a skip: the script reports it as a configuration
      # fault and exits 1, so a green check cannot mean "the secret was empty".
      - name: Check migration history consistency
        env:
          MIGRATIONS_DIR: ${{ github.workspace }}/supabase/migrations
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          # Read-only checks; prefer the project-scoped Database Read PAT when
          # provisioned, with the account PAT as the transition fallback.
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_READ_ONLY_ACCESS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
        run: bun scripts/check-migrations.mjs

      # The catalogue counterpart to the history check above. History asks "is
      # this migration recorded"; hygiene asks "is the schema still shaped the
      # way we agreed" — RLS present on every table, no index duplicating a
      # sibling, every foreign key indexed, and no service-only table still
      # granting the public roles. A finding is still a question rather than a
      # mechanical verdict — read the definitions before dropping or revoking
      # anything.
      #
      # Run even when migration history fails: the catalogue result is
      # independent, and a history error must not hide a hygiene finding.
      - name: Check schema hygiene
        if: always()
        env:
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          # Same read-only token policy as the migration-history check above.
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_READ_ONLY_ACCESS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
        run: bun scripts/check-schema-hygiene.mjs
