name: Supabase type freshness

# Read-only safety net for schema drift that did not arrive through
# supabase.yml: a migration applied by hand, a dashboard schema change, or a
# generated file that was not regenerated. It never deploys edge functions and
# never applies migrations.
#
# Scheduled and manual only. The push workflow already runs the same comparison
# after it applies migrations; this is the check for changes that bypass it.
# The job requires the project-scoped Database Read PAT: it is new, so it has no
# legacy reason to fall back to the account-wide deploy token.

on:
  schedule:
    # Daily, off-peak and deliberately not on :00 — the shared runner fleet is
    # the constraint for every scheduled workflow in this repository.
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  BUN_VERSION: "canary"
  # Public project identifier, not a credential. Kept in the variables store so
  # it has one source of truth with the other Supabase workflows.
  SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}

jobs:
  freshness:
    name: Generated types match the live schema
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # `--require-token` is the CI-only half of the wrapper: without it a
      # missing token is reported as a skip, which would make this scheduled
      # check look green while comparing nothing.
      #
      # This job accepts only the project-scoped Database Read PAT. The
      # account-wide SUPABASE_ACCESS_TOKEN is deliberately not a fallback.
      - name: Compare generated types with the live schema
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_READ_ONLY_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::SUPABASE_READ_ONLY_ACCESS_TOKEN secret is missing"; exit 1; }
          bun scripts/check-supabase-types.mjs --require-token
