name: Supabase type freshness

# Read-only safety net for schema drift that did not arrive through
# supabase.yml: a migration applied by hand, a dashboard schema change, or a
# generated file that was not regenerated. It never deploys edge functions and
# never applies migrations.
#
# Scheduled and manual only. The push workflow already runs the same comparison
# after it applies migrations; this is the check for changes that bypass it.
# The job prefers the project-scoped Database Read PAT. Until that secret is
# provisioned it falls back to the deploy token that already exists in CI; the
# comparison itself is read-only. Without either token the job reports a loud
# UNKNOWN skip instead of a red failure, because a missing credential is not
# evidence of schema drift.

on:
  schedule:
    # Daily, off-peak and deliberately not on :00 — the shared runner fleet is
    # the constraint for every scheduled workflow in this repository.
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  BUN_VERSION: "canary"
  # Public project identifier, not a credential. Kept in the variables store so
  # it has one source of truth with the other Supabase workflows.
  SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}

jobs:
  freshness:
    name: Generated types match the live schema
    runs-on: [self-hosted, linux]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # Prefer the project-scoped Database Read PAT; fall back to the deploy
      # token that exists today. The comparison is read-only either way.
      #
      # Without either credential this is an explicit UNKNOWN skip rather than a
      # red failure, because a missing token is not evidence of schema drift.
      # `--require-token` still applies on the path that actually compares, so
      # the check cannot look green while comparing nothing.
      - name: Compare generated types with the live schema
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_READ_ONLY_ACCESS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::notice::Generated-type freshness is UNKNOWN — neither SUPABASE_READ_ONLY_ACCESS_TOKEN nor SUPABASE_ACCESS_TOKEN is configured."
            echo "### Supabase type freshness: SKIPPED — no Supabase management token" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          bun scripts/check-supabase-types.mjs --require-token
