name: Runner Health

# Runs every 30 minutes — catches offline runners before a real CI job queues
# and sits there forever. Also runs on demand.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: runner-health
  cancel-in-progress: true

jobs:
  # ── Check both runners are alive via the GitHub API ─────────────────────────
  # Precision layer only: the smoke jobs below are the primary liveness
  # signal and run independently (no gate). If this API check cannot run
  # (e.g. token without Administration:read) it degrades to a warning —
  # a blind spot, never a false red. If it CAN run and a runner is offline,
  # it fails loudly by name.
  check-runners:
    name: Verify runners online
    # Self-hosted ONLY per repo policy (no github-hosted runners anywhere).
    # Runs on backend-runner; if backend itself is down this job QUEUES —
    # which is itself the alert (visible as "queued" in Actions).
    runs-on: [self-hosted, linux, ARM64, backend-runner]
    timeout-minutes: 5
    outputs:
      api_ok: ${{ steps.check.outputs.api_ok }}
      frontend_status: ${{ steps.check.outputs.frontend_status }}
      backend_status: ${{ steps.check.outputs.backend_status }}
      all_ok: ${{ steps.check.outputs.all_ok }}
    steps:
      - name: Ensure gh + jq available
        run: |
          if ! command -v gh &>/dev/null; then
            echo "gh not found — installing via apt"
            sudo apt-get update -qq
            sudo apt-get install -y -qq gh
          fi
          if ! command -v jq &>/dev/null; then
            echo "jq not found — installing via apt"
            sudo apt-get update -qq
            sudo apt-get install -y -qq jq
          fi
          gh --version
          jq --version

      - name: Check runner registration + status
        id: check
        env:
          # Listing runners needs Administration:read, which the default
          # GITHUB_TOKEN lacks. Prefer a fine-grained PAT stored as
          # RUNNERS_TOKEN (Administration → Read-only); fall back to the
          # default token and degrade to a warning if the API refuses —
          # the smoke jobs remain the source of truth.
          GH_TOKEN: ${{ secrets.RUNNERS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if ! RUNNERS=$(gh api "repos/${{ github.repository }}/actions/runners" \
            --jq '[.runners[] | {name, status, busy, labels: [.labels[].name | select(. != "self-hosted" and . != "linux" and . != "ARM64" and . != "X64")]}]'); then
            echo "::warning::Cannot list runners — token lacks Administration:read. Create a fine-grained PAT (Administration → Read-only, this repo only) as RUNNERS_TOKEN for precise per-runner status; smoke jobs below are the liveness signal meanwhile."
            echo "api_ok=false" >> "$GITHUB_OUTPUT"
            echo "all_ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "api_ok=true" >> "$GITHUB_OUTPUT"

          echo "Registered runners:"
          echo "$RUNNERS" | jq -r '.[] | "  \(.name): \(.status) (busy=\(.busy))"'

          FRONTEND=$(echo "$RUNNERS" | jq -r '.[] | select(.labels[] | test("frontend-runner")) | .status' || echo "missing")
          BACKEND=$(echo "$RUNNERS"  | jq -r '.[] | select(.labels[] | test("backend-runner"))  | .status' || echo "missing")

          # Fallback: if no labeled runners, check by name
          [[ -z "$FRONTEND" ]] && FRONTEND=$(echo "$RUNNERS" | jq -r '.[] | select(.name == "frontend-runner") | .status' || echo "missing")
          [[ -z "$BACKEND"  ]] && BACKEND=$(echo "$RUNNERS"  | jq -r '.[] | select(.name == "backend-runner")  | .status' || echo "missing")

          echo "frontend_status=${FRONTEND:-missing}" >> "$GITHUB_OUTPUT"
          echo "backend_status=${BACKEND:-missing}"   >> "$GITHUB_OUTPUT"

          if [[ "$FRONTEND" == "online" && "$BACKEND" == "online" ]]; then
            echo "all_ok=true" >> "$GITHUB_OUTPUT"
            echo "✅ Both runners online"
          else
            echo "all_ok=false" >> "$GITHUB_OUTPUT"
            echo "❌ Runner problem — frontend=$FRONTEND backend=$BACKEND"
          fi

      - name: Probe health endpoints (via Tailscale IPs)
        run: |
          # Runs on a self-hosted runner inside the Tailscale network, so
          # these probes return real health data (not silent skips).
          # Informational only — a changed Tailscale IP must not fail CI.
          for IP in "100.92.38.119" "100.99.241.23"; do
            RESULT=$(curl -fsSL --max-time 5 "http://${IP}:9100" 2>/dev/null || echo '{"ok":false,"error":"unreachable"}')
            echo "  ${IP}: $RESULT"
            case "$RESULT" in
              *unreachable*) echo "::warning::Runner host ${IP}:9100 unreachable — verify the Tailscale IP is current" ;;
            esac
          done

      - name: Fail if any runner offline
        # Only when the API actually answered — without data this step must
        # not fire (the smokes carry the signal instead).
        if: steps.check.outputs.api_ok == 'true' && steps.check.outputs.all_ok != 'true'
        run: |
          echo "::error::One or more self-hosted runners are offline or unregistered."
          echo ""
          echo "  frontend-runner: ${{ steps.check.outputs.frontend_status }}"
          echo "  backend-runner:  ${{ steps.check.outputs.backend_status }}"
          echo ""
          echo "Fix: SSH into the VPS and run:"
          echo "  curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/setup-runner.sh | bash -s -- --token <NEW_TOKEN> --name <NAME> --labels <LABELS>"
          echo ""
          echo "Get a fresh token:"
          echo "  gh api -X POST repos/${{ github.repository }}/actions/runners/registration-token --jq '.token'"
          exit 1

  # ── Smoke-test: queue a real job on each runner ─────────────────────────────
  # PRIMARY liveness signal: intentionally independent of check-runners (no
  # needs-gate). A dead runner shows here as a hung/failing smoke; a healthy
  # one proves itself even when the registration API is unreachable.
  smoke-frontend:
    name: Smoke test — frontend-runner
    runs-on: [self-hosted, linux, ARM64, frontend-runner]
    timeout-minutes: 3
    steps:
      - name: Runner is alive
        run: |
          echo "✅ frontend-runner responding"
          echo "  Host:   $(hostname)"
          echo "  Kernel: $(uname -r)"
          echo "  Arch:   $(uname -m)"
          echo "  CPU:    $(nproc) cores"
          echo "  RAM:    $(free -h | awk '/Mem:/{print $2}')"
          echo "  Swap:   $(free -h | awk '/Swap:/{print $2}')"
          echo "  Disk:   $(df -h / | awk 'NR==2{print $4" free"}')"
          echo "  Bun:    $(bun --version 2>/dev/null || echo 'not installed')"
          echo "  Node:   $(node --version 2>/dev/null || echo 'not installed')"

  smoke-backend:
    name: Smoke test — backend-runner
    runs-on: [self-hosted, linux, ARM64, backend-runner]
    timeout-minutes: 3
    steps:
      - name: Runner is alive
        run: |
          echo "✅ backend-runner responding"
          echo "  Host:    $(hostname)"
          echo "  Kernel:  $(uname -r)"
          echo "  Arch:    $(uname -m)"
          echo "  CPU:     $(nproc) cores"
          echo "  RAM:     $(free -h | awk '/Mem:/{print $2}')"
          echo "  Swap:    $(free -h | awk '/Swap:/{print $2}')"
          echo "  Disk:    $(df -h / | awk 'NR==2{print $4" free"}')"
          echo "  Supabase: $(supabase --version 2>/dev/null || echo 'not installed')"
          echo "  Bun:     $(bun --version 2>/dev/null || echo 'not installed')"
