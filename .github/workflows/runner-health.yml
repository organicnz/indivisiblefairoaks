name: Runner Health

# Runs hourly — catches offline runners before a real CI job queues
# and sits there forever. Also runs on demand.
# (Was every 30 minutes; 48 self-checks a day competed with real CI on the
# single runner. Outage detection latency goes 30 → 60 min; the
# queuing-is-the-alert design below is unchanged.)
# Least privilege. Without this the workflow inherits the repository default,
# which may grant write. It uses a runner-management PAT.
permissions:
  contents: read
  # Only for the outage-issue step below. Scoped to this workflow so no other
  # job inherits it.
  issues: write

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

concurrency:
  group: runner-health
  cancel-in-progress: true

jobs:
  # ── Check both runners are alive via the GitHub API ─────────────────────────
  # Precision layer only: the smoke jobs below are the primary liveness
  # signal and run independently (no gate). If this API check cannot run
  # (e.g. token without Administration:read) it degrades to a warning —
  # a blind spot, never a false red. If it CAN run and a runner is offline,
  # it fails loudly by name.
  check-runners:
    name: Verify runners online
    # Self-hosted ONLY per repo policy (no github-hosted runners anywhere).
    # Runs on backend-runner; if backend itself is down this job QUEUES —
    # which is itself the alert (visible as "queued" in Actions).
    runs-on: [self-hosted, linux, backend-runner]
    timeout-minutes: 5
    outputs:
      api_ok: ${{ steps.check.outputs.api_ok }}
      frontend_status: ${{ steps.check.outputs.frontend_status }}
      backend_status: ${{ steps.check.outputs.backend_status }}
      all_ok: ${{ steps.check.outputs.all_ok }}
    steps:
      - name: Ensure gh + jq available
        run: |
          if ! command -v gh &>/dev/null; then
            echo "gh not found — installing via apt"
            sudo apt-get update -qq
            sudo apt-get install -y -qq gh
          fi
          if ! command -v jq &>/dev/null; then
            echo "jq not found — installing via apt"
            sudo apt-get update -qq
            sudo apt-get install -y -qq jq
          fi
          gh --version
          jq --version

      - name: Check runner registration + status
        id: check
        env:
          # Listing runners needs Administration:read, which the default
          # GITHUB_TOKEN lacks. Prefer a fine-grained PAT stored as
          # RUNNERS_TOKEN (Administration → Read-only); fall back to the
          # default token and degrade to a warning if the API refuses —
          # the smoke jobs remain the source of truth.
          GH_TOKEN: ${{ secrets.RUNNERS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if ! RUNNERS=$(gh api "repos/${{ github.repository }}/actions/runners" \
            --jq '[.runners[] | {name, status, busy, labels: [.labels[].name | select(. != "self-hosted" and . != "linux" and . != "ARM64" and . != "X64")]}]'); then
            echo "::warning::Cannot list runners — token lacks Administration:read. Create a fine-grained PAT (Administration → Read-only, this repo only) as RUNNERS_TOKEN for precise per-runner status; smoke jobs below are the liveness signal meanwhile."
            echo "api_ok=false" >> "$GITHUB_OUTPUT"
            echo "all_ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "api_ok=true" >> "$GITHUB_OUTPUT"

          echo "Registered runners:"
          echo "$RUNNERS" | jq -r '.[] | "  \(.name): \(.status) (busy=\(.busy))"'

          FRONTEND=$(echo "$RUNNERS" | jq -r '.[] | select(.labels[] | test("frontend-runner")) | .status' || echo "missing")
          BACKEND=$(echo "$RUNNERS"  | jq -r '.[] | select(.labels[] | test("backend-runner"))  | .status' || echo "missing")

          # Fallback: if no labeled runners, check by name
          [[ -z "$FRONTEND" ]] && FRONTEND=$(echo "$RUNNERS" | jq -r '.[] | select(.name == "frontend-runner") | .status' || echo "missing")
          [[ -z "$BACKEND"  ]] && BACKEND=$(echo "$RUNNERS"  | jq -r '.[] | select(.name == "backend-runner")  | .status' || echo "missing")

          echo "frontend_status=${FRONTEND:-missing}" >> "$GITHUB_OUTPUT"
          echo "backend_status=${BACKEND:-missing}"   >> "$GITHUB_OUTPUT"

          if [[ "$FRONTEND" == "online" && "$BACKEND" == "online" ]]; then
            echo "all_ok=true" >> "$GITHUB_OUTPUT"
            echo "✅ Both runners online"
          else
            echo "all_ok=false" >> "$GITHUB_OUTPUT"
            echo "❌ Runner problem — frontend=$FRONTEND backend=$BACKEND"
          fi

      - name: Probe health endpoints (via Tailscale IPs)
        run: |
          # Runs on a self-hosted runner inside the Tailscale network, so
          # these probes return real health data (not silent skips).
          # Informational only — a changed Tailscale IP must not fail CI.
          for IP in "100.92.38.119" "100.99.241.23"; do
            RESULT=$(curl -fsSL --max-time 5 "http://${IP}:9100" 2>/dev/null || echo '{"ok":false,"error":"unreachable"}')
            echo "  ${IP}: $RESULT"
            case "$RESULT" in
              *unreachable*) echo "::warning::Runner host ${IP}:9100 unreachable — verify the Tailscale IP is current" ;;
            esac
          done

      - name: Fail if any runner offline
        # Only when the API actually answered — without data this step must
        # not fire (the smokes carry the signal instead).
        if: steps.check.outputs.api_ok == 'true' && steps.check.outputs.all_ok != 'true'
        run: |
          echo "::error::One or more self-hosted runners are offline or unregistered."
          echo ""
          echo "  frontend-runner: ${{ steps.check.outputs.frontend_status }}"
          echo "  backend-runner:  ${{ steps.check.outputs.backend_status }}"
          echo ""
          echo "Fix: SSH into the VPS and run:"
          echo "  curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/setup-runner.sh | bash -s -- --token <NEW_TOKEN> --name <NAME> --labels <LABELS>"
          echo ""
          echo "Get a fresh token:"
          echo "  gh api -X POST repos/${{ github.repository }}/actions/runners/registration-token --jq '.token'"
          exit 1

      # ── Make the outage reachable ─────────────────────────────────────────
      # A red workflow is not an alert. Nobody opens the Actions tab to confirm
      # that a 30-minute cron is still red, which is exactly what happened on
      # 2026-10-05: the container went offline, the next scheduled run queued
      # behind the dead runner, and the failure was invisible until a CI run was
      # expected and did not arrive.
      #
      # An issue is the only mechanism available here that reaches a human
      # unprompted — issues notify watchers — and the repo is self-hosted-only by
      # policy, so there is no GitHub-hosted cron that could watch the runners
      # for us.
      #
      # Idempotent on purpose: this runs hourly for as long as the
      # outage lasts. It comments on one long-lived issue rather than opening a
      # new one per tick, so a night-long outage produces a readable timeline
      # instead of dozens of duplicates.
      #
      # LIMITATION — read before relying on this. It fires only when this
      # workflow RUNS and the API answers. If the offline runner is the one that
      # would execute this job, the job queues and no issue is ever opened. That
      # case is unobservable from inside this repository: self-hosted-only policy
      # rules out the independent watcher that would catch it. Closing it needs
      # an external uptime monitor against the runner host, not a workflow
      # change. Until that exists, the residual gap is real — this narrows the
      # window, it does not close it.
      - name: Raise or update the runner-outage issue
        if: always() && steps.check.outputs.api_ok == 'true' && steps.check.outputs.all_ok != 'true'
        env:
          GH_TOKEN: ${{ secrets.RUNNERS_TOKEN || secrets.GITHUB_TOKEN }}
          FRONTEND: ${{ steps.check.outputs.frontend_status }}
          BACKEND: ${{ steps.check.outputs.backend_status }}
        run: |
          TITLE="Runner fleet offline"
          BODY=$(printf 'A self-hosted runner is offline or unregistered.\n\n| Runner | Status |\n|---|---|\n| frontend-runner | `%s` |\n| backend-runner | `%s` |\n\nCI jobs routed to an offline runner sit `queued` indefinitely.\n\n**Recovery:** SSH into the VPS and re-register:\n\n```\ncurl -fsSL https://raw.githubusercontent.com/%s/main/scripts/setup-runner.sh | bash -s -- --token <NEW_TOKEN> --name <NAME> --labels <LABELS>\n```\n\nThis issue closes itself when every runner reports `online` again.\n' "$FRONTEND" "$BACKEND" "${{ github.repository }}")

          # One open issue, found by title. `--state open` so a closed outage
          # does not get commented on.
          EXISTING=$(gh issue list --repo "${{ github.repository }}" --state open \
            --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "Commenting on existing issue #$EXISTING"
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" \
              --body "Still offline at $(date -u +%Y-%m-%dT%H:%M:%SZ) — frontend: \`$FRONTEND\`, backend: \`$BACKEND\`."
          else
            echo "Opening a new outage issue"
            gh issue create --repo "${{ github.repository }}" \
              --title "$TITLE" --body "$BODY" \
              --label runner-health 2>/dev/null \
              || gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body "$BODY"
          fi

      # The inverse: when every runner is back, close the issue rather than
      # leaving it to rot as a stale red. Skipped when the API could not be read,
      # because "we could not check" must never be read as "recovered".
      - name: Resolve the runner-outage issue when healthy
        if: steps.check.outputs.api_ok == 'true' && steps.check.outputs.all_ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.RUNNERS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh issue list --repo "${{ github.repository }}" --state open \
            --search "Runner fleet offline in:title" --json number --jq '.[0].number // empty')
          [ -z "$EXISTING" ] && exit 0
          echo "Fleet healthy again — closing #$EXISTING"
          gh issue close "$EXISTING" --repo "${{ github.repository }}" \
            --comment "All self-hosted runners report \`online\`. Closing."

      # A runner that dies mid-job leaves the job in_progress until GitHub's
      # timeout-minutes backstop eventually fires — which on a dead runner is
      # never, because the only thing that can fire it is the runner itself.
      # This is the watchdog that does not depend on the runner: any run whose
      # oldest in-flight job is older than 30 min is cancelled, long enough
      # that a healthy pass (worst observed ~27 min) is never touched, short
      # enough to unblock the queue. It is idempotent and the only candidate
      # is the same-repository CI workflow.
      - name: Cancel wedged in_progress runs (>30 min)
        env:
          GH_TOKEN: ${{ secrets.RUNNERS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          NOW=$(date -u +%s)
          gh run list --repo "${{ github.repository }}" --status in_progress --limit 20 \
            --json databaseId,startedAt \
            --jq '.[] | "\(.databaseId) \(.startedAt)"' | while read -r id started; do
            START=$(date -u -d "$started" +%s 2>/dev/null || echo "$NOW")
            AGE=$(( (NOW - START) / 60 ))
            if [ "$AGE" -gt 30 ]; then
              echo "Cancelling wedged run $id (age ${AGE}m)"
              gh run cancel "$id" --repo "${{ github.repository }}" || echo "::warning::failed to cancel $id"
            else
              echo "  run $id is ${AGE}m old — left alone"
            fi
          done

  # ── Smoke-test: queue a real job on each runner ─────────────────────────────
  # PRIMARY liveness signal: intentionally independent of check-runners (no
  # needs-gate). A dead runner shows here as a hung/failing smoke; a healthy
  # one proves itself even when the registration API is unreachable.
  smoke-frontend:
    name: Smoke test — frontend-runner
    runs-on: [self-hosted, linux, frontend-runner]
    timeout-minutes: 3
    steps:
      - name: Runner is alive
        run: |
          echo "✅ frontend-runner responding"
          echo "  Host:   $(hostname)"
          echo "  Kernel: $(uname -r)"
          echo "  Arch:   $(uname -m)"
          echo "  CPU:    $(nproc) cores"
          echo "  RAM:    $(free -h | awk '/Mem:/{print $2}')"
          echo "  Swap:   $(free -h | awk '/Swap:/{print $2}')"
          echo "  Disk:   $(df -h / | awk 'NR==2{print $4" free"}')"
          FREE_GB=$(df -m / | awk 'NR==2{printf "%d", $4/1024}')
          if [ "$FREE_GB" -lt 2 ]; then
            echo "::error::frontend-runner disk critically low (${FREE_GB} GB free) — builds, browser installs, and log uploads will fail. Free space on the host."
            exit 1
          fi
          [ "$FREE_GB" -lt 5 ] && echo "::warning::frontend-runner disk getting low (${FREE_GB} GB free)"
          echo "  Bun:    $(bun --version 2>/dev/null || echo 'not installed')"
          echo "  Node:   not required — the toolchain is Bun-only (see AGENTS.md)"

  smoke-backend:
    name: Smoke test — backend-runner
    runs-on: [self-hosted, linux, backend-runner]
    timeout-minutes: 3
    steps:
      - name: Runner is alive
        run: |
          echo "✅ backend-runner responding"
          echo "  Host:    $(hostname)"
          echo "  Kernel:  $(uname -r)"
          echo "  Arch:    $(uname -m)"
          echo "  CPU:     $(nproc) cores"
          echo "  RAM:     $(free -h | awk '/Mem:/{print $2}')"
          echo "  Swap:    $(free -h | awk '/Swap:/{print $2}')"
          echo "  Disk:   $(df -h / | awk 'NR==2{print $4" free"}')"
          FREE_GB=$(df -m / | awk 'NR==2{printf "%d", $4/1024}')
          if [ "$FREE_GB" -lt 2 ]; then
            echo "::error::backend-runner disk critically low (${FREE_GB} GB free) — deploys and log uploads will fail. Free space on the host."
            exit 1
          fi
          [ "$FREE_GB" -lt 5 ] && echo "::warning::backend-runner disk getting low (${FREE_GB} GB free)"
          echo "  Supabase: $(supabase --version 2>/dev/null || echo 'not installed')"
          echo "  Bun:     $(bun --version 2>/dev/null || echo 'not installed')"
