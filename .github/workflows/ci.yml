name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
  NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
  SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
  # Pin bun — bump deliberately. Check: https://github.com/oven-sh/bun/releases
  # Must satisfy package.json engines (bun >= 1.4.0).
  BUN_VERSION: "1.4.2"
  VERCEL_CLI_VERSION: "59.11.7"

jobs:
  # ── 1. Lint & Types ──────────────────────────────────────────────────────────
  lint:
    name: Lint & Types
    runs-on: [self-hosted, linux, ARM64, frontend-runner]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome lint
        run: bunx biome ci ./src

      - name: Oxlint
        run: bunx oxlint ./src

      - name: TypeScript
        run: bunx tsc --noEmit

  # ── 2. Unit Tests + Coverage ─────────────────────────────────────────────────
  test:
    name: Tests & Coverage
    runs-on: [self-hosted, linux, ARM64, frontend-runner]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests with coverage
        run: bun vitest run --coverage

  # ── 3. Build ─────────────────────────────────────────────────────────────────
  # Runs `vercel build` which:
  #   a) calls `next build` internally → produces .next/
  #   b) writes .vercel/output/ (Build Output API) → required for --prebuilt deploy
  # Both outputs are uploaded as a single artefact so downstream jobs never rebuild.
  build:
    name: Next.js Build
    runs-on: [self-hosted, linux, ARM64, frontend-runner]
    needs: [lint, test]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # vercel pull writes .vercel/.env.<env>.local — needed for correct
      # env-var injection during build (NEXT_PUBLIC_* get baked in at build time).
      - name: Pull Vercel environment
        run: |
          bunx --yes vercel@${{ env.VERCEL_CLI_VERSION }} pull --yes \
            --environment=${{ github.ref_name == 'main' && 'production' || 'preview' }} \
            --token=${{ secrets.VERCEL_TOKEN }}

      # vercel build = next build + .vercel/output/ generation.
      # --yes skips interactive prompts; env vars come from .vercel/.env.*.local.
      - name: Build (vercel build)
        run: bunx --yes vercel@${{ env.VERCEL_CLI_VERSION }} build \
          --yes \
          --debug \
          ${{ github.ref_name == 'main' && '--prod' || '' }} \
          --token=${{ secrets.VERCEL_TOKEN }}

      # Upload both outputs:
      #   .next/        — used by E2E (bunx next start)
      #   .vercel/      — used by deploy (vercel deploy --prebuilt needs .vercel/output/)
      #   public/       — static assets needed by next start
      # include-hidden-files: true is REQUIRED — .next/ and .vercel/ are hidden
      # directories (dot-prefix). upload-artifact@v4 skips hidden files by default.
      - name: Upload build artefact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: |
            .next/
            .vercel/
            public/
          include-hidden-files: true
          retention-days: 1

  # ── 4. E2E Tests ─────────────────────────────────────────────────────────────
  e2e:
    name: E2E Tests
    runs-on: [self-hosted, linux, ARM64, frontend-runner]
    needs: [build]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # download-artifact@v4 with path: . extracts to the working directory,
      # preserving the directory structure (.next/, .vercel/, public/ at repo root).
      - name: Download build artefact
        uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .

      - name: Verify build artefact
        run: |
          if [ ! -f ".next/BUILD_ID" ]; then
            echo "::error::.next/BUILD_ID missing — artefact download failed or build did not produce .next/"
            echo "Contents of current directory:"
            ls -la
            exit 1
          fi
          echo "✅ .next/BUILD_ID: $(cat .next/BUILD_ID)"

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run E2E tests
        run: bunx playwright test
        env:
          CI: "true"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # ── 5. Deploy to Vercel ───────────────────────────────────────────────────────
  # Push-only (not PRs). Uses the pre-built .vercel/output/ artefact.
  # vercel deploy --prebuilt reads .vercel/output/ — produced by vercel build above.
  deploy-vercel:
    name: Deploy → Vercel
    runs-on: [self-hosted, linux, ARM64, frontend-runner]
    needs: [build, e2e]
    if: github.event_name == 'push'
    timeout-minutes: 20
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download build artefact
        uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .

      - name: Verify prebuilt output
        run: |
          if [ ! -d ".vercel/output" ]; then
            echo "::error::.vercel/output/ missing — vercel build did not produce prebuilt output"
            ls -la .vercel/ 2>/dev/null || echo ".vercel/ directory not found"
            exit 1
          fi
          echo "✅ .vercel/output/ present"

      - name: Deploy to Vercel (prebuilt)
        id: deploy
        run: |
          URL=$(bunx --yes vercel@${{ env.VERCEL_CLI_VERSION }} deploy --prebuilt \
            ${{ github.ref_name == 'main' && '--prod' || '' }} \
            --yes \
            --debug \
            --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "✅ Deployed: $URL"

  # ── 6. Live Health Probe ──────────────────────────────────────────────────────
  health-probe:
    name: Live Health Probe
    runs-on: [self-hosted, linux, ARM64, frontend-runner]
    needs: [deploy-vercel]
    if: github.event_name == 'push'
    timeout-minutes: 5
    steps:
      - name: Wait for deployment to warm up and probe /api/health
        run: |
          URL="${{ needs.deploy-vercel.outputs.url }}"
          if [ -z "$URL" ]; then
            echo "No deployment URL — skipping probe"
            exit 0
          fi
          echo "Probing $URL/api/health (up to 90s)..."
          for i in $(seq 1 9); do
            STATUS=$(curl -fsSL -o /dev/null -w '%{http_code}' \
              --max-time 10 "${URL}/api/health" || echo 000)
            echo "  Attempt $i/9: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✅ Health check passed"
              exit 0
            fi
            [ "$i" -lt 9 ] && sleep 10
          done
          echo "::error::Health check failed after 90s — last status: $STATUS"
          exit 1
