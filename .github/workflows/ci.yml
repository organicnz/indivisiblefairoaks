name: CI

on:
  push:
    branches: [main, mainDeploy]
  pull_request:
    branches: [main, mainDeploy]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
  NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
  SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
  # Pin bun — bump deliberately. Check: https://github.com/oven-sh/bun/releases
  BUN_VERSION: "1.2.18"

jobs:
  # ── 1. Lint & Types ──────────────────────────────────────────────────────────
  lint:
    name: Lint & Types
    runs-on: [self-hosted, linux, ARM64, frontend-runner]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome lint
        run: bunx biome ci ./src

      - name: Oxlint
        run: bunx oxlint ./src

      - name: TypeScript
        run: bunx tsc --noEmit

  # ── 2. Unit Tests + Coverage ─────────────────────────────────────────────────
  test:
    name: Tests & Coverage
    runs-on: [self-hosted, linux, ARM64, frontend-runner]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests with coverage
        run: bun vitest run --coverage

  # ── 3. Build ─────────────────────────────────────────────────────────────────
  build:
    name: Next.js Build
    runs-on: [self-hosted, linux, ARM64, frontend-runner]
    needs: [lint, test]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      # Upload .next/ + public/ so E2E and deploy reuse it without rebuilding.
      # path: . ensures files extract to repo root on download-artifact@v4.
      - name: Upload build artefact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: |
            .next/
            public/
          retention-days: 1

  # ── 4. E2E Tests ─────────────────────────────────────────────────────────────
  e2e:
    name: E2E Tests
    runs-on: [self-hosted, linux, ARM64, frontend-runner]
    needs: [build]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # path: . is required — download-artifact@v4 without path extracts
      # into a subdirectory named after the artifact, not the repo root.
      - name: Download build artefact
        uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run E2E tests
        run: bunx playwright test
        env:
          CI: "true"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # ── 5. Deploy to Vercel ───────────────────────────────────────────────────────
  # Push-only (not PRs). Uses the pre-built .next/ artefact — no double build.
  deploy-vercel:
    name: Deploy → Vercel
    runs-on: [self-hosted, linux, ARM64, frontend-runner]
    needs: [build]
    if: github.event_name == 'push'
    timeout-minutes: 20
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    environment:
      name: ${{ github.ref_name == 'mainDeploy' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # path: . required — see note on E2E job above.
      - name: Download build artefact
        uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .

      # npx --yes avoids global install pollution on the runner.
      # vercel pull syncs env vars; vercel deploy --prebuilt skips the
      # Next.js build entirely — the artefact is already complete.
      - name: Pull Vercel environment
        run: |
          npx --yes vercel@latest pull --yes \
            --environment=${{ github.ref_name == 'mainDeploy' && 'production' || 'preview' }} \
            --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel (prebuilt)
        id: deploy
        run: |
          URL=$(npx --yes vercel@latest deploy --prebuilt \
            ${{ github.ref_name == 'mainDeploy' && '--prod' || '' }} \
            --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "✅ Deployed: $URL"

  # ── 6. Live Health Probe ──────────────────────────────────────────────────────
  health-probe:
    name: Live Health Probe
    runs-on: [self-hosted, linux, ARM64, frontend-runner]
    needs: [deploy-vercel]
    if: github.event_name == 'push'
    timeout-minutes: 5
    steps:
      - name: Wait for deployment to warm up and probe /api/health
        run: |
          URL="${{ needs.deploy-vercel.outputs.url }}"
          if [ -z "$URL" ]; then
            echo "No deployment URL — skipping probe"
            exit 0
          fi
          echo "Probing $URL/api/health (up to 90s)..."
          for i in $(seq 1 9); do
            STATUS=$(curl -fsSL -o /dev/null -w '%{http_code}' \
              --max-time 10 "${URL}/api/health" || echo 000)
            echo "  Attempt $i/9: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "✅ Health check passed"
              exit 0
            fi
            [ "$i" -lt 9 ] && sleep 10
          done
          echo "::error::Health check failed after 90s — last status: $STATUS"
          exit 1
