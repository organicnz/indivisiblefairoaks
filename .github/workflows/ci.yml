name: CI

on:
  push:
    branches: [main, mainDeploy]
  pull_request:
    branches: [main, mainDeploy]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Public vars needed for next build / e2e
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
  NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
  # Private server-only vars
  SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
  # Pin bun — bump deliberately. Floor is package.json engines (bun >= 1.4.0).
  BUN_VERSION: "1.4.2"

jobs:
  # ── 1. Lint & Types ──────────────────────────────────────────────────────────
  lint:
    name: Lint & Types
    runs-on: [self-hosted, linux, ARM64, frontend-runner]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome lint
        run: bunx biome ci ./src

      - name: Oxlint
        run: bunx oxlint ./src

      - name: TypeScript
        run: bunx tsc --noEmit

  # ── 2. Unit Tests + Coverage ─────────────────────────────────────────────────
  test:
    name: Tests & Coverage
    runs-on: [self-hosted, linux, ARM64, frontend-runner]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests with coverage
        run: bun vitest run --coverage

  # ── 3. Build ─────────────────────────────────────────────────────────────────
  build:
    name: Next.js Build
    runs-on: [self-hosted, linux, ARM64, frontend-runner]
    needs: [lint, test]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      # Upload the build artefact so the E2E job reuses it
      # instead of building a second time.
      - name: Upload build artefact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: |
            .next/
            public/
          include-hidden-files: true
          retention-days: 1

  # ── 4. E2E Tests ─────────────────────────────────────────────────────────────
  e2e:
    name: E2E Tests
    runs-on: [self-hosted, linux, ARM64, frontend-runner]
    needs: [build]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download build artefact
        uses: actions/download-artifact@v4
        with:
          name: next-build

      - name: Install Playwright browsers
        # No --with-deps: OS dependencies are baked into the runner image and
        # persist system-wide. Re-add --with-deps after a runner rebuild if
        # browsers fail to launch with missing shared libraries.
        run: bunx playwright install chromium

      - name: Run E2E tests
        run: bunx playwright test
        env:
          CI: "true"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # ── 5. Live Health Probe (production) ───────────────────────────────────────
  # Production deploys natively via Vercel Git integration on every main
  # push (PRs get native previews too), so verify what users actually hit.
  # Custom domains are excluded from Deployment Protection — a 302/401 here
  # IS a real failure, no bypass handling.
  #
  # NOTE: a CLI deploy-vercel job used to live here. Removed: it only
  # produced spare preview duplicates while production shipped via git, it
  # doubled upload consumption, and the free-tier upload API rate-limited
  # it (api-upload-free) into permanent red. Don't re-add it.
  health-probe:
    name: Live Health Probe
    runs-on: [self-hosted, linux, ARM64, frontend-runner]
    # CI build completion is the sync point: by then the Git-driven
    # production deploy (~3-4 min) is settled or nearly so; the 90 s
    # retry loop below absorbs the remainder.
    needs: [build]
    if: github.event_name == 'push'
    timeout-minutes: 5
    steps:
      - name: Probe production deployment
        env:
          SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
        run: |
          URL="${SITE_URL:-https://indivisiblefairoaks.org}"
          URL="${URL%/}"
          # Allow up to 90 s for the Git-driven production deploy to settle
          for i in $(seq 1 9); do
            STATUS=$(curl -o /dev/null -sw '%{http_code}' "${URL}/api/health" || echo 000)
            echo "Attempt $i: HTTP $STATUS"
            # 200 = healthy. 503 = serving but degraded (DB blip) — the
            # deploy is up, so that passes; the warning flags the DB side.
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "503" ]; then
              echo "✅ Production is serving (HTTP $STATUS)"
              if [ "$STATUS" = "503" ]; then
                echo "::warning::/api/health reports degraded — check Supabase, not the deploy"
              fi
              exit 0
            fi
            sleep 10
          done
          echo "❌ Production health check failed after 90 s (last HTTP $STATUS)"
          exit 1
