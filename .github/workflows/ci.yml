name: CI

on:
  push:
    branches: [main, mainDeploy]
  pull_request:
    branches: [main, mainDeploy]

# ── Why every job here used to wait forever ──────────────────────────────────
# Read this before changing the selectors back.
#
# `runs-on` names `[self-hosted, linux, ARM64, …]` because that is the only
# runner registered to this repository: `personal-organicnz`, an Apple-silicon
# Mac. It was previously excluded by an `X64` selector, which is a **partial**
# overlap — `frontend-runner` matched, `X64` did not — so the jobs sat `queued`
# with no error anywhere. PRs #53–#56 got further and failed at exactly
# `20m0s`, a job timeout rather than a lint error, because an x86 runner was
# still reachable then and has since gone away.
#
# **A `runs-on` selector that matches nothing does not error — it waits
# forever**, and `cancel-in-progress: true` below cancels the previous run as the
# next push lands, so the queue never visibly grows. The run history reads as a
# series of quiet `cancelled` runs with a green tick beside the merged PR, which
# is the most dangerous kind of fake control: indistinguishable from passing.
#
# **Do not diagnose this from the run list.** A queued job and an unservable
# selector look identical there. Ask the two questions that can tell them apart:
#
#   gh api repos/$REPO/actions/runners -q '.runners[] | {name, status, busy}'
#   gh api repos/$REPO/actions/runners -q '.runners[].labels[].name'
#
# A green runner list is not evidence that a job can run; the labels are the
# only thing that decides it, which is why the two `gh` calls above are both
# needed. `scripts/setup-runner.sh` documents the label sets.
#
# The x86 fleet this repository was originally served by (**ghrunner**, rootless
# Podman + Quadlet on one VPS behind Tailscale) declared this repo in
# `instances/indivisiblefairoaks.env` with an `X64` label, and on 2026-10-03 it
# went offline because the `ghrunner` podman network was missing — every
# `podman run --network=ghrunner` exited 125 with `network not found`. Nothing
# about the selectors caused that, and restoring the fleet is a separate piece of
# work in ../ghrunner. Until then these jobs run on the Mac, which means **CI now
# depends on that machine being awake and online**; a sleeping host presents as
# the same silent queue described above.
#
# The host is no longer the ceiling it was. The VPS was 887 MiB / 2 vCPU, where
# `tsc` peaked around 598 MB and jobs ended `cancelled` once swap was exhausted;
# `cancelled` there meant the host ran out of room, not that the code was wrong.
# See docs/ci-runners.md.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # These are repository *variables*, not secrets. `NEXT_PUBLIC_*` is inlined
  # into the client bundle by Next and is therefore readable by every visitor —
  # it is configuration, not a credential. Storing it as a secret also broke
  # this workflow: `pull_request` runs do not receive repository secrets when the
  # PR comes from a fork, so the values arrived empty, `env.ts`'s `.default()`
  # absorbed it, and the build happily succeeded against placeholder credentials.
  # Repository variables are available to fork PRs, so the build is now
  # deterministic in every case. See docs/ci-secrets.md.
  NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
  NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
  # Pin bun — bump deliberately. Floor is package.json engines (bun >= 1.4.0).
  BUN_VERSION: "1.4.2"

jobs:
  # ── 1. Lint & Types ──────────────────────────────────────────────────────────
  lint:
    name: Lint & Types
    runs-on: [self-hosted, linux, ARM64, frontend-runner]
    timeout-minutes: 15
    # The `NODE_OPTIONS: --max-old-space-size=768` this job used to carry is gone
    # for the same reason as the build job's: it worked around a 448MB default
    # heap cap on an 887 MiB container, and this runner sizes its own heap from
    # the machine's RAM. See the note on the build job.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # Ephemeral runners get a fresh container per job, so each of the four
      # jobs below re-downloaded the whole dependency tree — measured at ~13 min
      # for `bun install` alone on the fleet host, which is most of why a run
      # overran its budget there. This caches bun's package cache, not
      # node_modules: entries are integrity-checked by bun, so a stale or partial
      # cache cannot produce a wrong tree, and it cannot go stale the way a
      # cached node_modules does.
      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome lint
        run: bunx biome ci ./src

      - name: Oxlint
        run: bunx oxlint ./src

      - name: TypeScript
        run: bunx tsc --noEmit

  # ── 2. Unit Tests + Coverage ─────────────────────────────────────────────────
  test:
    name: Tests & Coverage
    runs-on: [self-hosted, linux, ARM64, frontend-runner]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # Ephemeral runners get a fresh container per job, so each of the four
      # jobs below re-downloaded the whole dependency tree — measured at ~13 min
      # for `bun install` alone on the fleet host, which is most of why a run
      # overran its budget there. This caches bun's package cache, not
      # node_modules: entries are integrity-checked by bun, so a stale or partial
      # cache cannot produce a wrong tree, and it cannot go stale the way a
      # cached node_modules does.
      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests with coverage
        run: bun vitest run --coverage

  # ── 3. Build ─────────────────────────────────────────────────────────────────
  build:
    name: Next.js Build
    runs-on: [self-hosted, linux, ARM64, frontend-runner]
    needs: [lint, test]
    timeout-minutes: 20
    # The `NODE_OPTIONS: --max-old-space-size=768` this job used to carry is gone
    # with the host that needed it. It capped the heap because the build was
    # killed by a cgroup at `MEMORY=1024M` — exit 137 / SIGKILL — not by V8, and
    # the only runner registered here is a Mac with no such ceiling. Carrying the
    # cap forward would have been actively unsafe: 768MB is *below* Node's own
    # default on a machine with this much RAM, so it would invite a heap OOM that
    # the old container could never produce. tsc's measured peak on the old host
    # was ~598MB, so lint is unaffected either way.
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # Ephemeral runners get a fresh container per job, so each of the four
      # jobs below re-downloaded the whole dependency tree — measured at ~13 min
      # for `bun install` alone on the fleet host, which is most of why a run
      # overran its budget there. This caches bun's package cache, not
      # node_modules: entries are integrity-checked by bun, so a stale or partial
      # cache cannot produce a wrong tree, and it cannot go stale the way a
      # cached node_modules does.
      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        env:
          NEXT_E2E_BUILD: "true"
          # Source-map upload for the Sentry plugin. The plugin skips upload
          # when the token is absent; next.config.ts additionally passes
          # undefined for e2e builds, so a bundle that is never deployed never
          # uploads maps under the release its production twin uses.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: bun run build

      # Upload the build artefact so the E2E job reuses it
      # instead of building a second time.
      - name: Upload build artefact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: |
            .next/
            public/
          include-hidden-files: true
          retention-days: 1

  # ── 4. E2E Tests ─────────────────────────────────────────────────────────────
  e2e:
    name: E2E Tests
    runs-on: [self-hosted, linux, ARM64, frontend-runner]
    needs: [build]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      # Ephemeral runners get a fresh container per job, so each of the four
      # jobs below re-downloaded the whole dependency tree — measured at ~13 min
      # for `bun install` alone on the fleet host, which is most of why a run
      # overran its budget there. This caches bun's package cache, not
      # node_modules: entries are integrity-checked by bun, so a stale or partial
      # cache cannot produce a wrong tree, and it cannot go stale the way a
      # cached node_modules does.
      - name: Cache bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download build artefact
        uses: actions/download-artifact@v4
        with:
          name: next-build

      - name: Install Playwright browsers
        # No --with-deps: OS dependencies are baked into the runner image and
        # persist system-wide. Re-add --with-deps after a runner rebuild if
        # browsers fail to launch with missing shared libraries.
        # The installed binary, not `bunx`: `playwright` is only a transitive
        # dependency, so `bunx` would resolve it from the registry and run a
        # different version than the lockfile pins.
        run: ./node_modules/.bin/playwright install chromium

      - name: Run E2E tests
        run: ./node_modules/.bin/playwright test
        env:
          CI: "true"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # ── 5. Live Health Probe (Next.js app) ──────────────────────────────────────
  # The Next.js app lives on test.indivisiblefairoaks.org (see
  # docs/infrastructure-and-email-recovery-log.md). The apex + www deliberately
  # 302 to a Google Site — probing them would always fail. Verify the host
  # that actually serves this codebase.
  #
  # NOTE: a CLI deploy-vercel job used to live here. Removed: it only
  # produced spare preview duplicates while production shipped via git, it
  # doubled upload consumption, and the free-tier upload API rate-limited
  # it (api-upload-free) into permanent red. Don't re-add it.
  health-probe:
    name: Live Health Probe
    runs-on: [self-hosted, linux, ARM64, frontend-runner]
    # CI build completion is the sync point: by then the Git-driven
    # Vercel deploy (~3-4 min) is settled or nearly so; the 90 s
    # retry loop below absorbs the remainder.
    needs: [build]
    if: github.event_name == 'push'
    timeout-minutes: 5
    steps:
      - name: Probe app deployment
        env:
          SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
        run: |
          # Fallback is the staging host that serves this app — NOT the apex
          # (apex intentionally redirects to Google Sites).
          URL="${SITE_URL:-https://test.indivisiblefairoaks.org}"
          URL="${URL%/}"
          # Allow up to 90 s for the Git-driven Vercel deploy to settle
          for i in $(seq 1 9); do
            STATUS=$(curl -o /dev/null -sw '%{http_code}' "${URL}/api/health" || echo 000)
            echo "Attempt $i: HTTP $STATUS ($URL)"
            # 200 = healthy. 503 = serving but degraded (DB blip) — the
            # deploy is up, so that passes; the warning flags the DB side.
            # 302 = hit the apex Google-Sites redirect (wrong host).
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "503" ]; then
              echo "✅ App is serving (HTTP $STATUS)"
              if [ "$STATUS" = "503" ]; then
                echo "::warning::/api/health reports degraded — check Supabase, not the deploy"
              fi
              exit 0
            fi
            if [ "$STATUS" = "302" ] || [ "$STATUS" = "301" ]; then
              echo "::error::Redirect (HTTP $STATUS) — probe host is not the Next.js app (apex points at Google Sites). Check NEXT_PUBLIC_SITE_URL."
              exit 1
            fi
            sleep 10
          done
          echo "❌ App health check failed after 90 s (last HTTP $STATUS from $URL)"
          exit 1
