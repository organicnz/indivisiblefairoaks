name: CI

on:
  push:
    branches: [main, mainDeploy]
  pull_request:
    branches: [main, mainDeploy]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Public vars needed for next build — add matching secrets in repo Settings → Secrets
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
  NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
  # Private vars (server-only, not exposed to client bundle)
  SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
  # Supabase Access Token for edge function deployment (required for GitHub Actions)
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

jobs:
  # ── 1. Lint & types ──────────────────────────────────────────────────────────
  lint:
    name: Lint & Types
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome lint
        run: bunx biome lint ./src

      - name: Oxlint
        run: bunx oxlint ./src

      - name: TypeScript
        run: bunx tsc --noEmit

  # ── 2. Unit tests + coverage ─────────────────────────────────────────────────
  test:
    name: Tests & Coverage
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests with coverage
        run: bun vitest run --coverage

  # ── 3. Build ─────────────────────────────────────────────────────────────────
  build:
    name: Next.js Build
    runs-on: self-hosted
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

  # ── 4. Deploy to Vercel (mainDeploy → production, PRs → preview) ─────────────
  deploy:
    name: Deploy → Vercel
    runs-on: self-hosted
    needs: [build]
    # Only deploy on push (not on PRs from forks), and only for main/mainDeploy
    if: github.event_name == 'push'
    environment:
      name: ${{ github.ref_name == 'mainDeploy' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Vercel CLI
        run: bun add -g vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=${{ github.ref_name == 'mainDeploy' && 'production' || 'preview' }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build for Vercel
        run: vercel build ${{ github.ref_name == 'mainDeploy' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          URL=$(vercel deploy --prebuilt ${{ github.ref_name == 'mainDeploy' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "✅ Deployed: $URL"

      - name: Deploy Edge Functions to Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy search --project-ref indivisible-fairoaks
          supabase migrate up --project-ref indivisible-fairoaks

  # ── 5. E2E Tests ────────────────────────────────────────────────────────────
  e2e-tests:
    name: End-to-End Tests
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright
        run: bun add -g playwright && playwright install

      - name: Run E2E tests
        run: |
          # Start the dev server in background
          bun run dev &
          DEV_PID=$!
          sleep 5

          # Run playwright tests
          npx playwright test

          # Kill the dev server
          kill $DEV_PID 2>/dev/null || true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: playwright-report/
          retention-days: 30