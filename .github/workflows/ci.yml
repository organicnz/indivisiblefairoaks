name: CI

on:
  push:
    branches: [main, mainDeploy]
  pull_request:
    branches: [main, mainDeploy]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Public vars needed for next build / e2e
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
  NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
  # Private server-only vars
  SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
  # Pin bun — bump deliberately. Floor is package.json engines (bun >= 1.4.0).
  BUN_VERSION: "1.4.2"

jobs:
  # ── 1. Lint & Types ──────────────────────────────────────────────────────────
  lint:
    name: Lint & Types
    runs-on: [self-hosted, linux, ARM64, frontend-runner]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome lint
        run: bunx biome ci ./src

      - name: Oxlint
        run: bunx oxlint ./src

      - name: TypeScript
        run: bunx tsc --noEmit

  # ── 2. Unit Tests + Coverage ─────────────────────────────────────────────────
  test:
    name: Tests & Coverage
    runs-on: [self-hosted, linux, ARM64, frontend-runner]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests with coverage
        run: bun vitest run --coverage

  # ── 3. Build ─────────────────────────────────────────────────────────────────
  build:
    name: Next.js Build
    runs-on: [self-hosted, linux, ARM64, frontend-runner]
    needs: [lint, test]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      # Upload the build artefact so the E2E job reuses it
      # instead of building a second time.
      - name: Upload build artefact
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: |
            .next/
            public/
          include-hidden-files: true
          retention-days: 1

  # ── 4. E2E Tests ─────────────────────────────────────────────────────────────
  e2e:
    name: E2E Tests
    runs-on: [self-hosted, linux, ARM64, frontend-runner]
    needs: [build]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download build artefact
        uses: actions/download-artifact@v4
        with:
          name: next-build

      - name: Install Playwright browsers
        # No --with-deps: OS dependencies are baked into the runner image and
        # persist system-wide. Re-add --with-deps after a runner rebuild if
        # browsers fail to launch with missing shared libraries.
        run: bunx playwright install chromium

      - name: Run E2E tests
        run: bunx playwright test
        env:
          CI: "true"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # ── 5. Deploy to Vercel ───────────────────────────────────────────────────────
  deploy-vercel:
    name: Deploy → Vercel
    runs-on: [self-hosted, linux, ARM64, frontend-runner]
    # Gated on green E2E: nothing ships to Vercel with a red suite.
    needs: [build, e2e]
    timeout-minutes: 20
    # Only deploy on push (not on PR) for main/mainDeploy
    if: github.event_name == 'push'
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    environment:
      name: ${{ github.ref_name == 'mainDeploy' && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # NOTE: the next-build artefact is for the E2E job only. `vercel build`
      # below always rebuilds from source, so downloading it here would be
      # pure waste — don't re-add a download step.
      - name: Install Vercel CLI
        run: bun add -g vercel@59

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=${{ github.ref_name == 'mainDeploy' && 'production' || 'preview' }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build for Vercel
        run: vercel build ${{ github.ref_name == 'mainDeploy' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        id: deploy
        run: |
          # stdout stays captured (success path byte-identical), stderr goes to
          # a file. On failure BOTH are surfaced: vercel prints its banner to
          # stderr but the actual error may land on either stream.
          if ! URL=$(vercel deploy --prebuilt ${{ github.ref_name == 'mainDeploy' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }} 2>/tmp/vercel-deploy.stderr); then
            echo "::error::vercel deploy --prebuilt failed. stdout: $URL --- stderr: $(cat /tmp/vercel-deploy.stderr)"
            exit 1
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "✅ Deployed: $URL"

  # ── 6. Live Health Probe (production) ───────────────────────────────────────
  # Production deploys natively via Vercel Git integration on every main
  # push (the deploy-vercel job above only yields a spare preview). So verify
  # what users actually hit. Custom domains are excluded from Deployment
  # Protection — a 302/401 here IS a real failure, no bypass handling.
  health-probe:
    name: Live Health Probe
    runs-on: [self-hosted, linux, ARM64, frontend-runner]
    needs: [deploy-vercel]
    if: github.event_name == 'push'
    timeout-minutes: 5
    steps:
      - name: Probe production deployment
        env:
          SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL }}
        run: |
          URL="${SITE_URL:-https://indivisiblefairoaks.org}"
          URL="${URL%/}"
          # Allow up to 90 s for the Git-driven production deploy to settle
          for i in $(seq 1 9); do
            STATUS=$(curl -o /dev/null -sw '%{http_code}' "${URL}/api/health" || echo 000)
            echo "Attempt $i: HTTP $STATUS"
            # 200 = healthy. 503 = serving but degraded (DB blip) — the
            # deploy is up, so that passes; the warning flags the DB side.
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "503" ]; then
              echo "✅ Production is serving (HTTP $STATUS)"
              if [ "$STATUS" = "503" ]; then
                echo "::warning::/api/health reports degraded — check Supabase, not the deploy"
              fi
              exit 0
            fi
            sleep 10
          done
          echo "❌ Production health check failed after 90 s (last HTTP $STATUS)"
          exit 1
