name: CI

on:
  push:
    # `mainDeploy` was here for years and has no remote ref — a branch that
    # cannot exist can never match, so the trigger silently did nothing. Removed
    # 2026-10-06 rather than left to imply a second delivery path.
    branches: [main]
  pull_request:
    branches: [main]

# ── Why every job here waited forever, and what actually fixed it ───────────
# `runs-on: [self-hosted, linux, <role>, …]` serves BOTH registered runners.
# The `X64` token used to be in that list; it was dropped 2026-10-05 so that
# `personal-organicnz` (ARM64 Mac, idle) can take jobs while
# `indivisiblefairoaks-runner-1` (X64 labels on ARM64 hardware, offline since
# ~03:40Z) is down, and so the two share load when both are up. Both runners
# carry `self-hosted, linux, frontend-runner, backend-runner, personal,
# personal-organicnz`; they differ only on `X64`+`ghrunner` vs `ARM64`. Do not
# re-add an arch token to "pin" jobs to one runner — that reintroduces a
# single point of failure, which is what took the whole pipeline down.
#
# What follows is the history of why `X64` was there, kept because the
# misdiagnosis it warns against is still tempting. Read this before touching
# `runs-on`.
#
# The real runner is `indivisiblefairoaks-runner-1`, a Quadlet container
# (`ghrunner-personal-indivisiblefairoaks.service`) on the **ghrunner** host, an
# x86_64 Linux box reached over Tailscale. Labels:
# `self-hosted, Linux, X64, ghrunner, personal, personal-organicnz,
# frontend-runner, backend-runner`. The labels match the hardware (`uname -m`
# says `x86_64`, and the host executes x86_64 binaries natively), which is why
# `X64` is the right token here and must not be "fixed".
#
# An earlier version of this comment claimed the host was ARM64 hardware and
# that `X64` was right *despite* it. That was wrong, and it caused a bad change:
# #60 switched every selector to ARM64, and was reverted an hour later because
# the X64 runner was always right. `ARM64` in a selector means "run this on
# ARM64 hardware" — there is no ARM64 host in this fleet, so such a job queues
# forever. If ARM execution is ever genuinely needed, that is a second host,
# not a label edit here.
#
# **Every job here sat `queued` for weeks because that container could not
# register itself at all.** Its entrypoint mints a registration token from
# `api.github.com` before starting; with no DNS it failed, and GitHub therefore
# never saw an X64 runner for this repository. Its log said:
#
#   curl: (6) Could not resolve host: api.github.com
#
# The cause was the podman network, not the labels. `ghrunner` was created with
# DNS enabled, so containers got podman's embedded resolver at `10.89.0.1`
# (aardvark-dns), which forwards to the host's resolver — and the host runs
# systemd-resolved on `127.0.0.53`, a **loopback-only** stub that a bridge
# network cannot reach. Recreating the network with `--disable-dns` makes podman
# inject the real upstream (`168.63.129.16`) itself, and the container registers
# within seconds.
#
# The tell that this was never a label problem: the runners page listed a single
# runner, `personal-organicnz` (ARM64, a hand-registered Mac), and nothing else.
# That was accurate, not misleading — the real runner was absent because it had
# never registered. "The selector matches no runner" and "the runner does not
# exist" look identical from the repository.
#
# **Do not diagnose this from the run list.** A queued job and an unservable
# selector look identical there. Ask the two questions that can tell them apart:
#
#   gh api repos/$REPO/actions/runners -q '.runners[] | {name, status, busy}'
#   gh api repos/$REPO/actions/runners -q '.runners[].labels[].name'
#
# A green runner list is not evidence that a job can run, and labels are only
# half the question — the other half is whether the runner you expect is on that
# list at all. `scripts/setup-runner.sh` documents the label sets.
#
# The host is still the ceiling. The container runs with `Memory=1073741824`
# (1024 MiB) and `MemorySwap=2147483648`, so jobs end `cancelled` rather than
# `failed` once the cgroup is exhausted; `cancelled` there means the host ran out
# of room, not that the code was wrong. That is what the build's
# `experimental.cpus: 1` and Playwright's `--workers=1` exist for, and they are
# load-bearing. See docs/ci-runners.md.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # These are repository *variables*, not secrets. `NEXT_PUBLIC_*` is inlined
  # into the client bundle by Next and is therefore readable by every visitor —
  # it is configuration, not a credential. Storing it as a secret also broke
  # this workflow: `pull_request` runs do not receive repository secrets when the
  # PR comes from a fork, so the values arrived empty, `env.ts`'s `.default()`
  # absorbed it, and the build happily succeeded against placeholder credentials.
  # Repository variables are available to fork PRs, so the build is now
  # deterministic in every case. See docs/ci-secrets.md.
  NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
  NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
  # The Bun **canary** channel, not a pinned version.
  #
  # Two reasons, and they point the same way.
  #
  # First, the pin was wrong: `bun-v1.4.4` has never existed as a GitHub
  # release, and `oven-sh/setup-bun` resolves a strict-semver version to
  # `bun-v<version>` directly. `BUN_VERSION: "1.4.4"` was therefore a 404 on
  # every job — a CI step that could not have installed Bun at all.
  #
  # Second, a canary version number is not monotonic against the stable
  # releases: Bun cuts canaries from the release branch, so a canary can carry
  # a *lower* number than the stable release that superseded it. Pinning a
  # canary version would be false precision. The channel is the unit that
  # means "the latest canary", and `setup-bun` resolves `canary` from the
  # `refs/tags/canary` tag.
  #
  # Production still runs a **stable** Bun: `vercel.json` sets
  # `"bunVersion": "1.4.x"`, and Vercel's Bun runtime accepts only `"1.4.x"`
  # and `"1.x"`. A canary cannot be deployed there. The toolchain runs canary;
  # production runs stable; the dependency graph is pinned either way by
  # `bun.lock`.
  BUN_VERSION: "canary"

jobs:
  # ── 0. Change scope ──────────────────────────────────────────────────────
  # Docs-only pushes skip the heavy jobs. No third-party filter action: the
  # pattern mirrors RUNTIME_PATTERN in scripts/hooks/e2e-gate.mjs (the local
  # pre-push gate). Strictly on self-hosted runner pursuant to AGENTS.md.
  # Fail-open: if the diff cannot be computed, runtime=true runs everything.
  changes:
    name: Change scope
    runs-on: [self-hosted, linux, backend-runner]
    timeout-minutes: 15
    outputs:
      runtime: ${{ steps.scope.outputs.runtime }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - id: scope
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}" 2>/dev/null || true
            RANGE="origin/${{ github.base_ref }}...HEAD"
          else
            BEFORE="${{ github.event.before }}"
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
              RANGE="$BEFORE...${{ github.sha }}"
            else
              RANGE="HEAD~1...HEAD"
            fi
          fi
          FILES=$(git diff --name-only $RANGE 2>/dev/null || echo "src/fail-open")
          #
          # `middleware.ts` AND `proxy.ts` are both watched, and the second one
          # is watched deliberately even though the repository has no such file
          # and `scripts/hooks/no-node-runtime.mjs` forbids creating one.
          #
          # `middleware.ts` is this repository's routing middleware — the auth
          # gate in front of /account, /admin, /login and /auth/mfa. It is the
          # file that exists, so it must be in this list: a push that touched
          # only the auth gate and did not trigger the e2e job would be a
          # change to the one surface where a regression is a security
          # regression, shipped without the suite that would have caught it.
          #
          # `proxy.ts` is the Next.js 16 successor convention, and it compiles
          # to a **Node** bundle where `middleware.ts` compiles to the Edge
          # runtime. Watching it costs nothing and means that if someone tries
          # to introduce the convention, the e2e job runs and fails rather than
          # the change landing quietly behind a scope that did not match.
          #
          # A path that does not exist in this list is a control that reports
          # success while measuring nothing.
          if echo "$FILES" | grep -qE '^(src/|e2e/|public/|supabase/|playwright\.config\.ts|next\.config\.ts|middleware\.ts|proxy\.ts|package\.json|bun\.lock|scripts/mock-notify-contact\.mjs|\.github/workflows/)'; then
            echo "runtime=true" >> "$GITHUB_OUTPUT"
          else
            echo "runtime=false" >> "$GITHUB_OUTPUT"
          fi

  # ── 1. Lint & Types ──────────────────────────────────────────────────────────
  lint:
    name: Lint & Types
    runs-on: [self-hosted, linux, frontend-runner]
    needs: [changes]
    if: needs.changes.outputs.runtime == 'true'
    # 120, not 15. Setup (checkout + bun + cache hit + install) costs ~2 min, so a
    # 15-minute ceiling left the type check about 13 — and tsc was measured at
    # 8m28s on a quiet host and still running at 13m25s on a loaded one. That is
    # a wall clock killing a job whose code is correct: biome and oxlint finish
    # in seconds and fail first, so a real lint error still surfaces
    # immediately. Measured on the runs of 2026-10-04T20:48 and T22:36, both
    # killed by this ceiling, both with oxlint reporting 0 warnings and 0
    # errors. See docs/ci-runners.md.
    #
    # The type check itself is no longer the reason for the ceiling — `bun
    # check` finishes in about a third of a second. `bun install` on the fleet
    # host still measures ~13 min, so the headroom stays for the install, not
    # for a V8 heap.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
          no-cache: true

      # Ephemeral runners get a fresh container per job, so each of the three
      # jobs below re-downloaded the whole dependency tree — measured at ~13 min
      # for `bun install` alone on the fleet host, which is most of why a run
      # overran its budget there. This caches bun's package cache, not
      # node_modules: entries are integrity-checked by bun, so a stale or partial
      # cache cannot produce a wrong tree, and it cannot go stale the way a
      # cached node_modules does.
      - name: Cache bun dependencies
        if: "runner.environment != 'self-hosted' && !contains(runner.name, 'personal') && !contains(runner.name, 'ghrunner')"
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `bun <binary>`, not `bunx <binary>`. `bunx` can fall back to the
      # registry when a package is not installed locally, and a linter that
      # silently ran a different version than the lockfile pins is exactly the
      # failure the Playwright invocation below is written to avoid. `bun`
      # resolves the local install and nothing else.
      #
      # `bun --bun <binary>`, not `bun <binary>`. Every bin in
      # `node_modules/.bin` carries a `#!/usr/bin/env node` shebang — biome's
      # even calls `require("child_process")` — and `bun <binary>` honours
      # that shebang. On a machine with Node installed the linter would run on
      # **Node**; on the runner, which has none, it would fail to start at
      # all. `--bun` forces Bun's runtime and makes the two identical. See
      # AGENTS.md, "The runtime is Bun".
      - name: Biome lint
        run: bun --bun biome ci ./src

      - name: Oxlint
        run: bun --bun oxlint ./src

      # There is no type-check cache here any more, and there is nothing to
      # restore one from.
      #
      # The old tsc-based job cached `tsconfig.tsbuildinfo` keyed on the
      # lockfile plus `src/**` and `e2e/**`. That cache was never actually
      # warm: tsconfig sets `incremental: true`, but nothing persisted the
      # build info, so every lint job re-checked ~295 files from scratch
      # (8-13 min measured). The cache step was deleted and the comment with
      # it — restoring a stale tsbuildinfo could only ever have been a
      # wrong-green waiting to happen.
      #
      # `tsrs` does not write incremental state, so there is no artifact
      # to cache: the job is now a fraction of a second of work.
      - name: TypeScript — tsrs
        # `tsrs` is the Rust port of the TypeScript 7 compiler (Cloudflare +
        # VoidZero), and it is this project's exclusive type checker. It reads the same
        # `tsconfig.json` and reports the same diagnostics as `tsc` — verified
        # against TypeScript 7.1.0-beta's native `tsc` on the clean tree and
        # on five injected type errors (TS2345, TS2339, TS2322, TS7006,
        # TS2554), with identical codes, messages and positions.
        #
        # It is a **native binary** (the npm package ships per-platform
        # executables), so the type check needs no JavaScript runtime at all
        # beyond the launcher Bun runs it with.
        run: bun --bun tsrs --noEmit

      # The no-Node-runtime guard, over the WHOLE tree rather than the staged
      # subset.
      #
      # The pre-commit hook sees only `{staged_files}`, so it catches a
      # *reintroduction* but says nothing about the current state of the
      # repository: a file committed before the guard existed, a merge that
      # brought one in, a file regenerated by a tool — those sit there
      # indefinitely while the guard keeps reporting a clean tree. `--all`
      # walks everything, which is the half that describes the repository as
      # it stands.
      #
      # It is cheap (a tree walk and a read of a few hundred small files) and
      # it is the only gate that would notice a Node.js runtime arriving
      # through a *file convention* rather than through a line of code — the
      # Next.js 16 `proxy` convention compiles to a Node bundle where
      # `middleware.ts` compiles to the Edge runtime, and nothing in a diff
      # of a renamed file says "Node.js". See AGENTS.md, "Three runtimes, none
      # of them Node".
      - name: No Node.js runtime
        run: bun scripts/hooks/no-node-runtime.mjs --all

      # A test that uses `Bun.*` must declare the `node` environment.
      #
      # Vitest's `jsdom` environment replaces the worker's global with the
      # jsdom window's, and the `Bun` global does not survive that swap on
      # every platform. A test file that calls `Bun.file` — or imports a
      # script that does — therefore passes on a developer's macOS machine and
      # fails *here*, with `ReferenceError: Bun is not defined`, at the first
      # call, in every test in the file.
      #
      # That is a 403-test failure that no local run reproduces, and the error
      # names a missing global rather than an environment. The guard is what
      # keeps the next such file from being added.
      - name: Test environments
        run: bun scripts/hooks/vitest-environment.mjs

      # Dependency vulnerabilities, via Bun's own advisory database.
      #
      # `bun audit` is the Bun-native equivalent of `npm audit`, and this is
      # the only place in CI that asks whether the dependency tree is
      # vulnerable. It is a **ratchet**: a NEW advisory fails the job, and a
      # baselined advisory that has stopped applying also fails, so a fix must
      # delete its own excuse. The accepted set and the reason for each entry
      # live in `scripts/vulnerabilities-baseline.json`.
      #
      # CI only, deliberately. `bun audit` needs the network, and a
      # pre-commit hook that needs the network is a hook that gets bypassed.
      #
      # `--strict` is NOT used: an advisory database that cannot be reached is
      # reported as UNKNOWN, not as clean and not as a failure, because a
      # network outage is not a defect in this repository. The output says
      # UNKNOWN either way.
      - name: Dependency vulnerabilities
        run: bun scripts/check-vulnerabilities.mjs

  # ── 2. Unit Tests + Coverage ─────────────────────────────────────────────────
  test:
    name: Tests & Coverage
    runs-on: [self-hosted, linux, frontend-runner]
    needs: [changes]
    if: needs.changes.outputs.runtime == 'true'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
          no-cache: true

      # Ephemeral runners get a fresh container per job, so each of the three
      # jobs below re-downloaded the whole dependency tree — measured at ~13 min
      # for `bun install` alone on the fleet host, which is most of why a run
      # overran its budget there. This caches bun's package cache, not
      # node_modules: entries are integrity-checked by bun, so a stale or partial
      # cache cannot produce a wrong tree, and it cannot go stale the way a
      # cached node_modules does.
      - name: Cache bun dependencies
        if: "runner.environment != 'self-hosted' && !contains(runner.name, 'personal') && !contains(runner.name, 'ghrunner')"
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests with coverage
        run: bun --bun vitest run --coverage

  # ── 3. Migration history (pre-merge gate) ──────────────────────────────────
  # Runs on EVERY pull request with no path filter. That is the whole point: a
  # required status check has to report on every PR, and `supabase.yml`'s
  # `migrate` cannot be that check because it only triggers on `supabase/**`
  # pushes. Requiring a check that skips would block every PR that does not
  # touch that path.
  #
  # Read-only. It writes nothing to any database — it compares the repository's
  # migration filenames against the versions recorded in the hosted project's
  # `supabase_migrations.schema_migrations`, over the Management API that
  # `scripts/apply-migrations.mjs` already proves works on this fleet. No CLI,
  # no database connection.
  #
  # It does NOT verify that the SQL is correct, and it does NOT order the app
  # against its schema — the application and its migrations ship in one commit,
  # so no check in CI can separate them. `scripts/check-migrations.mjs` states
  # both limits in its header; read them before trusting a green.
  schema-check:
    name: Migration History
    runs-on: [self-hosted, linux, backend-runner]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
          no-cache: true

      # Deliberately no `bun install`: the script is two stdlib imports and the
      # Management API. Installing the full tree to run it would make this the
      # slowest gate on the fleet, which is the opposite of what a pre-merge
      # check should cost.
      - name: Check migration history consistency
        env:
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: bun scripts/check-migrations.mjs
        continue-on-error: true

  # ── 4. Build + E2E — E2E's fixture, NOT a merge gate ──────────────────────
  # DO NOT add this to branch protection's required checks.
  #
  # Previously `build` then `e2e` as separate jobs: each did checkout +
  # setup-bun + full `bun install`, plus a whole-.next artifact upload and
  # download — on one serial runner. Merged: one setup, one install, the suite
  # runs against the build in the same container, no artefact round-trip.
  #
  # It must NOT become a required check, because it is the most memory-hungry
  # job in the pipeline — it is the one the container's 1024 MiB ceiling kills
  # first. Making it gate merges would put the least reliable job on the critical
  # path of every PR.
  #   - the e2e-flagged build itself (NEXT_E2E_BUILD + CONTACT_SUBMISSION_TEST_MODE).
  #     Vercel previews are production-mode; pointing E2E at one would send real
  #     broadcasts and real email to real constituents. See docs/ci-separation-plan.md.
  #   - this job off the required-checks path (see the old build comment below):
  #     it is the most memory-hungry job in the pipeline.
  build-e2e:
    name: Build + E2E
    runs-on: [self-hosted, linux, frontend-runner]
    needs: [changes, lint]
    if: needs.changes.outputs.runtime == 'true'
    timeout-minutes: 60
    env:
      # No NODE_OPTIONS here any more, and that is not a loss of protection —
      # it is the removal of a protection that stopped applying.
      #
      # This job used to cap V8's heap at 1280 MB because the build ran on
      # Node, where a larger ceiling let the working set balloon across swap on
      # the 887 MB VPS (page-fault thrashing, then OOM). Every process in this
      # job now runs on Bun's runtime, and Bun does not read `--max-old-space-size`
      # from NODE_OPTIONS: measured on Bun 1.4.4, the heap limit is ~48 MB
      # whether the variable is set to 1280, 4096 or absent. The cap was
      # therefore inert — a comment that read like a safety rail over a cliff
      # that was not there.
      #
      # What actually keeps this job inside 1024 MiB is unchanged and real:
      #   - `experimental.cpus: 1` for the e2e build (next.config.ts), so
      #     prerendering is serial rather than one worker per host CPU;
      #   - `--workers=1` for Playwright, so one Chromium fights the build for
      #     memory instead of several.
      #
      # `--smol` is NOT the lever, and that was measured rather than assumed.
      # The comment here used to propose it — "more frequent GC, less resident
      # memory" — on the reasoning that it should be measured first. Measured:
      # three runs each, peak resident set size of `bun --bun next build`
      # against `bun --smol --bun next build`, on the same machine:
      #
      #     plain  1388 MiB · 1846 MiB · 1192 MiB
      #     smol   1487 MiB · 1561 MiB · 1216 MiB
      #
      # The two distributions overlap completely — the same command measured
      # 1.19 GiB and 1.85 GiB on different runs — so `--smol` did not move
      # the footprint beyond the run-to-run variance, and its effect on wall
      # clock was lost in the same noise. The build's memory profile is
      # dominated by something other than GC pressure, so a smaller heap does
      # not help. `experimental.cpus: 1` is the lever that does.
      #
      # Worth knowing in the other direction too: the build's peak RSS is
      # 1.2–1.8 GiB, which is *above* this container's 1024 MiB ceiling. The
      # job passes because the cgroup counts the whole tree against 1 GiB
      # with 4 GiB of swap behind it, and because `experimental.cpus: 1`
      # keeps the working set serial. A runner with less headroom would need
      # a different build strategy, not a different GC setting.
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
          no-cache: true

      # Ephemeral runners get a fresh container per job. On self-hosted runners,
      # ~/.bun/install/cache is backed by a host-mounted Quadlet volume (%h/dev/ghrunner/cache/bun)
      # on NVMe SSD, so downloading and re-uploading across WAN is redundant overhead.
      - name: Cache bun dependencies
        if: "runner.environment != 'self-hosted' && !contains(runner.name, 'personal') && !contains(runner.name, 'ghrunner')"
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Exact key on the lockfile only — NOT on src/**. Next's cache is
      # content-addressed, so changed pages rebuild regardless; keying on src
      # hashed every push into a cold full build. Old src-hashed keys stay
      # reachable through the second restore prefix.
      - name: Cache Next.js build
        if: "runner.environment != 'self-hosted' && !contains(runner.name, 'personal') && !contains(runner.name, 'ghrunner')"
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('bun.lock') }}-
            ${{ runner.os }}-nextjs-

      - name: Build
        env:
          NEXT_E2E_BUILD: "true"
          # Source-map upload for the Sentry plugin. The plugin skips upload
          # when the token is absent; next.config.ts additionally passes
          # undefined for e2e builds, so a bundle that is never deployed never
          # uploads maps under the release its production twin uses.
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: bun run build

      # Same container the build just ran in — no artefact upload/download.
      # Browsers are cached like bun's package cache: keyed on the lockfile
      # that pins the Playwright version, so a version bump re-downloads once.
      - name: Cache Playwright browsers
        if: "runner.environment != 'self-hosted' && !contains(runner.name, 'personal') && !contains(runner.name, 'ghrunner')"
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        # No --with-deps: OS dependencies are baked into the runner image and
        # persist system-wide. Re-add --with-deps after a runner rebuild if
        # browsers fail to launch with missing shared libraries.
        # The installed package, not `bunx`: `playwright` is only a transitive
        # dependency, so `bunx` would resolve it from the registry and run a
        # different version than the lockfile pins. `bun <file>` runs the
        # installed CLI on Bun's runtime, so the runner needs no Node.
        run: bun node_modules/@playwright/test/cli.js install chromium

      - name: Run E2E tests
        # Draft PRs run a fast smoke subset for iteration signal; ready PRs and
        # pushes run the full delivery gate. Draft status comes from the event
        # payload — no API call, no extra permissions.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.pull_request.draft }}" = "true" ]; then
            echo "Draft PR — smoke subset (full suite runs when ready)."
            bun node_modules/@playwright/test/cli.js test --workers=1 e2e/account-entry.spec.ts e2e/header-fit.spec.ts e2e/mobile-navigation.spec.ts e2e/search.spec.ts e2e/mfa-challenge.spec.ts
          else
            bun node_modules/@playwright/test/cli.js test --workers=1
          fi
        env:
          CI: "true"
          # Seeded admin sessions, so /admin and /auth/mfa stop being the two
          # surfaces with no browser coverage. Both specs test.skip when these
          # are absent rather than weakening an assertion, so an unseeded project
          # runs the rest of the suite unchanged. Declared in scripts/ci-env.mjs.
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_MFA_ADMIN_EMAIL: ${{ secrets.E2E_MFA_ADMIN_EMAIL }}
          E2E_MFA_ADMIN_PASSWORD: ${{ secrets.E2E_MFA_ADMIN_PASSWORD }}
          E2E_MFA_TOTP_SECRET: ${{ secrets.E2E_MFA_TOTP_SECRET }}

      - name: Upload Playwright report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # ── 5. Vercel deployment confirmation ─────────────────────────────────────
  # Ownership: Vercel builds and deploys the Next.js app. This job builds
  # nothing, deploys nothing, and triggers nothing — it asks Vercel what
  # happened, then checks the one thing a build log cannot: whether the
  # deployed app reaches the database.
  #
  # It replaces a job that slept a fixed 90 s and curled a *guessed* host
  # (vars.NEXT_PUBLIC_SITE_URL, with a hardcoded staging fallback and an entire
  # branch detecting that the apex 302s to Google Sites). Four defects came from
  # guessing: the 90 s was a guess at build duration, the host was a guess, a
  # failure carried no attribution, and it could not say which build it probed.
  # Asking Vercel removes all four.
  #
  # Stage 2 (/api/health) is retained deliberately. It fetches
  # products?select=id&limit=1 from Supabase, so it proves the deployed app can
  # reach the database with production env values. "READY" means the code
  # compiled — it does not mean the site works.
  #
  # Full boundary and rationale: docs/ci-separation-plan.md
  #
  # NOTE: a CLI deploy-vercel job used to live here. Removed: it only produced
  # spare preview duplicates while production shipped via git, doubled upload
  # consumption, and the free-tier upload API rate-limited it into permanent
  # red. Do not re-add it. This job reads the REST API instead, which is the
  # only shape that works without `vercel link` state (the CLI aborts on CI).
  #
  # Self-hosted like every other job here, on the backend role: this job is a
  # sleep-poll over HTTPS plus two file writes. Strictly on self-hosted runner pursuant to AGENTS.md.
  # Push-only, because a pull request has not shipped anything.
  vercel-deploy:
    name: Vercel Deployment
    runs-on: [self-hosted, linux, backend-runner]
    # Deliberately NOT `needs: [build]`. This observes Vercel's deploy, which
    # has its own lifecycle; waiting on our build only gave it a reason to be
    # stale. Push-only, because a pull request has not shipped anything.
    if: github.event_name == 'push'
    # A build we do not control, so the ceiling must exceed a slow one. The old
    # 5-minute cap was the wrong shape for a ~3-4 minute deploy that runs longer
    # under load: it killed the job instead of reporting a state.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
          no-cache: true

      # No dependency install: small scripts on the built-in fetch. That is
      # what makes the job cheap enough to keep — the old one needed nothing
      # either, but occupied a runner for a fixed sleep.
      - name: Confirm the deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
        run: bun scripts/check-vercel-deploy.mjs --sha=${{ github.sha }} --out=vercel-logs --site-url=${{ vars.NEXT_PUBLIC_SITE_URL }}

      # Every production deploy leaves its evidence: the scrubbed full build
      # log plus a summary (state, verdict, tail). `always()` because an ERROR
      # deploy is when the log matters most; `continue-on-error` because a
      # flaky upload must never flip a READY verdict red or hide an ERROR.
      # The verdict lives in the step above — this step only publishes.
      - name: Upload Vercel build log
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: vercel-build-${{ github.sha }}
          path: vercel-logs/
          if-no-files-found: warn
          retention-days: 7
