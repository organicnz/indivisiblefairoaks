# Lefthook – Git hooks for Indivisible Fair Oaks-Carmichael
# Docs: https://github.com/evilmartians/lefthook
#
# Skip a hook entirely : LEFTHOOK=0 git commit
# Skip one command     : LEFTHOOK_EXCLUDE=<name> git <action>
#
# ── Baseline metrics (update when intentionally changed) ─────────────────────
    # suppress-count baseline: 24  (checked in pre-push; composition is
    # documented beside the BASELINE below)

# coverage threshold     : 90% (checked in pre-push + vitest.config.ts)
# env contract           : every code-referenced env var exists in .env.example
# lockfile contract      : package.json and bun.lock must move together
# deps contract          : all non-optional peerDependencies must be satisfied
# e2e gate               : pre-push runs Playwright when the push range touches
#                          runtime/e2e surfaces (src, e2e, public, supabase, configs);
#                          docs-only pushes skip. Pre-commit only list-parses specs.
# ─────────────────────────────────────────────────────────────────────────────

# ─── pre-commit ───────────────────────────────────────────────────────────────
pre-commit:
  parallel: true
  commands:

    # ── 1. Secret leak detection ──────────────────────────────────────────────
    # Body: scripts/hooks/no-secrets.mjs
    no-secrets:
      priority: 1
      glob: "*.{ts,tsx,js,mjs,json,yml,yaml,env,md}"
      run: bun scripts/hooks/no-secrets.mjs {staged_files}

    # ── 2. Migration guard ────────────────────────────────────────────────────
    # Body: scripts/hooks/migration-guard.mjs
    migration-guard:
      priority: 2
      glob: "supabase/migrations/*.sql"
      run: bun scripts/hooks/migration-guard.mjs

    # ── 3. SQL: new tables must have RLS enabled ──────────────────────────────
    # Body: scripts/hooks/rls-table-guard.mjs
    rls-table-guard:
      priority: 3
      glob: "supabase/migrations/*.sql"
      run: bun scripts/hooks/rls-table-guard.mjs {staged_files}

    # ── 4. SQL: SECURITY DEFINER must set search_path ─────────────────────────
    # Body: scripts/hooks/sql-security-definer-guard.mjs
    sql-security-definer-guard:
      priority: 4
      glob: "supabase/migrations/*.sql"
      run: bun scripts/hooks/sql-security-definer-guard.mjs {staged_files}

    # ── 5. Security-path console.log audit ───────────────────────────────────
    # Body: scripts/hooks/no-debug-logs.mjs
    no-debug-logs:
      priority: 5
      glob: "{src/app/api/**,src/app/admin/**,middleware}.{ts,tsx}"
      run: bun scripts/hooks/no-debug-logs.mjs {staged_files}

    # ── 6. No @ts-ignore / eslint-disable in security-critical paths ─────────
    # Body: scripts/hooks/no-suppressions-in-security-paths.mjs
    no-suppressions-in-security-paths:
      priority: 6
      glob: "{src/app/api/**,src/app/admin/**,middleware}.{ts,tsx}"
      run: bun scripts/hooks/no-suppressions-in-security-paths.mjs {staged_files}

    # ── 7. process.env must not be accessed outside src/lib/env.ts ───────────
    # Body: scripts/hooks/no-raw-env-access.mjs
    no-raw-env-access:
      priority: 7
      glob: "src/**/*.{ts,tsx}"
      run: bun scripts/hooks/no-raw-env-access.mjs {staged_files}

    # ── 8. New pages must be covered by metadata (page or route layout) ────────
    # Body: scripts/hooks/metadata-coverage.mjs
    metadata-coverage:
      priority: 8
      glob: "src/app/**/page.tsx"
      run: bun scripts/hooks/metadata-coverage.mjs {staged_files}

    # ── 9. use client guard — hooks without directive ────────────────────────
    # Body: scripts/hooks/use-client-guard.mjs
    use-client-guard:
      priority: 9
      glob: "src/**/*.{ts,tsx}"
      run: bun scripts/hooks/use-client-guard.mjs {staged_files}

    # ── 10. Admin client scope guard ──────────────────────────────────────────
    # Body: scripts/hooks/admin-client-scope.mjs
    admin-client-scope:
      priority: 10
      glob: "src/**/*.{ts,tsx}"
      run: bun scripts/hooks/admin-client-scope.mjs {staged_files}

    # ── 11. Server actions must have 'use server' directive ───────────────────
    # Body: scripts/hooks/server-action-directive.mjs
    server-action-directive:
      priority: 11
      glob: "src/**/{actions,action}.{ts,tsx}"
      run: bun scripts/hooks/server-action-directive.mjs {staged_files}

    # ── 12. dangerouslySetInnerHTML without sanitize guard ────────────────────
    # Body: scripts/hooks/no-raw-innerhtml.mjs
    no-raw-innerhtml:
      priority: 12
      glob: "*.{ts,tsx}"
      run: bun scripts/hooks/no-raw-innerhtml.mjs {staged_files}

    # ── 13. Env integrity check ───────────────────────────────────────────────
    # Body: scripts/hooks/env-integrity.mjs
    env-integrity:
      priority: 13
      glob: ".env*"
      run: bun scripts/hooks/env-integrity.mjs

    # ── 14. Hardcoded Supabase project ref guard (new files only) ────────────
    # Body: scripts/hooks/no-new-hardcoded-ref.mjs
    no-new-hardcoded-ref:
      priority: 14
      glob: "*.{ts,tsx,js,mjs}"
      run: bun scripts/hooks/no-new-hardcoded-ref.mjs

    # ── 15. GitHub Actions env contract ───────────────────────────────────────
    # Catches a workflow referencing a secret/variable that does not exist, a
    # half-applied rename, a NEXT_PUBLIC_* value parked in the secrets store
    # (public by construction, and withheld from fork PRs), and a credentialed
    # workflow with no explicit least-privilege `permissions:` block.
    vercel-env-contract:
      glob: "{src/**/*.ts,src/**/*.tsx,.env.example,scripts/vercel-env.mjs,scripts/check-vercel-env.mjs}"
      run: bun scripts/check-vercel-env.mjs
      stage_fixed: false

    # ── 16. Supabase edge function secret contract ────────────────────────────
    # Catches a secret the edge code reads but neither the manifest nor
    # env.example.md documents, a manifest entry no function reads, a deployed
    # function missing from the manifest, and stale entries in the example file.
    # The hosted-project side of this (are they actually SET?) needs network and
    # the Supabase CLI, so it is asserted in .github/workflows/supabase.yml.
    edge-secret-contract:
      glob: "{supabase/functions/**/*.ts,supabase/functions/*.md,supabase/functions/*.mjs,scripts/check-edge-secrets.mjs}"
      run: bun scripts/check-edge-secrets.mjs
      stage_fixed: false

    ci-env-contract:
      priority: 15
      glob: "{.github/workflows/*.yml,scripts/ci-env.mjs,scripts/check-ci-env.mjs}"
      run: bun scripts/check-ci-env.mjs
      stage_fixed: false

    # ── 17. Secrets registry consistency ─────────────────────────────────────
    # The three gates above are all offline: each proves a manifest agrees with
    # the source, and none can see a dashboard. This one asserts the layer they
    # cannot express — that every credential has an owner, a blast radius, and
    # an expected store. It runs in --offline mode so it needs no CLI, no token
    # and no network, because a hook that needs credentials is a hook that gets
    # bypassed. The live reconciliation runs on a schedule in
    # .github/workflows/secret-audit.yml, where a token actually exists.
    secrets-registry:
      priority: 15
      glob: "{scripts/secrets-registry.mjs,scripts/secrets-audit.mjs,scripts/ci-env.mjs,scripts/vercel-env.mjs,supabase/functions/secrets.manifest.mjs}"
      run: bun scripts/secrets-audit.mjs --offline
      stage_fixed: false

    # ── 18. Auth redirect origin guard ───────────────────────────────────────
    # The hosted `site_url` and `uri_allow_list` decide where a magic link goes
    # and whether its callback is accepted. Neither is readable from the
    # repository, and this project shipped with both naming an unrelated domain —
    # so login was broken in a way no test, build or review could surface.
    #
    # Offline it proves the code-side cause cannot return: an absolute
    # `/auth/callback` URL baked into application source. The live settings are
    # reconciled nightly by the same script's --live mode in
    # .github/workflows/secret-audit.yml, where the token exists.
    # Body: scripts/check-auth-redirects.mjs
    auth-redirects:
      priority: 15
      glob: "{src/**/*.ts,src/**/*.tsx,scripts/check-auth-redirects.mjs}"
      run: bun scripts/check-auth-redirects.mjs
      stage_fixed: false

    # ── 19. Large file guard ──────────────────────────────────────────────────
    # Body: scripts/hooks/no-large-files.mjs
    no-large-files:
      priority: 16
      run: bun scripts/hooks/no-large-files.mjs {staged_files}

    # ── 20. Empty API route directory guard ──────────────────────────────────
    # Body: scripts/hooks/no-empty-api-routes.mjs
    no-empty-api-routes:
      priority: 17
      glob: "src/app/api/**"
      run: bun scripts/hooks/no-empty-api-routes.mjs

    # ── 21. Edge function import scope ─────────────────────────────────────
    # Body: scripts/hooks/edge-import-scope.mjs
    edge-import-scope:
      priority: 18
      glob: "supabase/functions/**/*.ts"
      run: bun scripts/hooks/edge-import-scope.mjs {staged_files}

    # ── 22. Merge conflict markers ─────────────────────────────────────────
    # Body: scripts/hooks/no-conflict-markers.mjs
    no-conflict-markers:
      priority: 19
      run: bun scripts/hooks/no-conflict-markers.mjs {staged_files}

    # ── 23. Workflow YAML sanity ───────────────────────────────────────────
    # Body: scripts/hooks/workflow-yaml.mjs
    workflow-yaml:
      priority: 20
      glob: ".github/workflows/*.{yml,yaml}"
      run: bun scripts/hooks/workflow-yaml.mjs {staged_files}

    # ── 24. Biome – format + lint staged files ────────────────────────────────
    biome-check:
      priority: 21
      glob: "*.{js,jsx,ts,tsx,json,css}"
      run: bun biome check --write --no-errors-on-unmatched --files-ignore-unknown=true {staged_files}
      stage_fixed: true

    # ── 25. oxlint – React / hooks / Next.js rules ───────────────────────────
    oxlint:
      priority: 22
      glob: "*.{ts,tsx}"
      run: bun oxlint {staged_files}

    # ── 26. TypeScript – type-check without full build ────────────────────────
    typecheck:
      priority: 23
      glob: "*.{ts,tsx}"
      run: bun tsc --noEmit --incremental false

    # ── 27. E2E spec list check (no browsers) ────────────────────────────────
    # Body: scripts/hooks/e2e-spec-list.mjs
    e2e-spec-list:
      priority: 24
      glob: "e2e/**/*.spec.ts"
      run: bun scripts/hooks/e2e-spec-list.mjs

    # ── 28. Env usage coverage ────────────────────────────────────────────────
    # Body: scripts/hooks/env-usage-coverage.mjs
    env-usage-coverage:
      priority: 25
      glob: "src/**/*.{ts,tsx}"
      run: bun scripts/hooks/env-usage-coverage.mjs {staged_files}

    # ── 29. Lockfile pairing ──────────────────────────────────────────────────
    # Body: scripts/hooks/lockfile-pair.mjs
    lockfile-pair:
      priority: 26
      run: bun scripts/hooks/lockfile-pair.mjs

    # ── 30. Documentation numeric claims ──────────────────────────────────────
    # AGENTS.md and docs/ state how many pre-commit guards exist, how long
    # lefthook.yml runs to, and how many specs the delivery gate executes. Those
    # numbers drift silently, and AGENTS.md once carried two that disagreed with
    # each other — "24 pre-commit guards" four hundred lines from "the
    # twenty-nine". The script owns the pattern list, so the prose stays the
    # source of truth and this cannot become a second list to keep in sync.
    #
    # Deliberately no glob: a gate that only runs when docs change is a gate that
    # stops guarding the moment a spec is added without touching them. It costs
    # ~0.5s, most of it `playwright test --list`.
    #
    # It does not check the unit-test count on purpose. `vitest list` enumerates
    # 848 declarations where `vitest run` executes 961, because dynamically
    # generated cases are absent from the listing — so the obvious cheap source
    # of truth is simply wrong, and a wrong ground truth fails correct documents.
    # The reasoning lives in scripts/check-doc-claims.mjs so nobody "fixes" the
    # omission by wiring it in.
    doc-claims:
      priority: 27
      run: bun scripts/check-doc-claims.mjs

    # ── 31. Edge Function type-check ─────────────────────────────────────────
    # The command `supabase.yml` runs as its first deploy step, run locally so a
    # type error cannot reach `main` on a runner that may be weeks behind. A
    # `ReturnType<typeof createClient>` annotation in crm-broadcast-send sat on
    # `main` through four merges for exactly that reason: the only gate was the
    # deploy job, and the deploy job had not run since 2026-09-24.
    #
    # `--no-lock` is the one deliberate difference from CI. This runs mid-commit,
    # and the committed `deno.lock` is stale enough that the locking form rewrites
    # it on every edge-function commit, leaving the tree dirty behind a commit the
    # developer believes is clean. CI keeps the locking form, because a deploy path
    # should have integrity pinning and a throwaway checkout can absorb the write.
    # Type resolution is identical either way; only the write differs.
    #
    # Sibling of `edge-import-scope` (priority 18), same glob.
    edge-typecheck:
      priority: 28
      glob: "supabase/functions/**/*.ts"
      run: bun run typecheck:edge

# ─── commit-msg ───────────────────────────────────────────────────────────────
commit-msg:
  commands:
    conventional:
      run: bun scripts/hooks/commit-msg.mjs {1}

# ─── post-commit ──────────────────────────────────────────────────────────────
# Auto-regenerate TypeScript types when a migration is committed.
# Guarded: only runs if the commit actually touched supabase/migrations/*.sql.
post-commit:
  commands:
    regen-types-on-migration:
      run: bun scripts/hooks/post-commit-regen-types.mjs

# ─── pre-push ─────────────────────────────────────────────────────────────────
pre-push:
  parallel: false
  commands:

    # ── 1. Block direct pushes to main ───────────────────────────────────────
    # Body: scripts/hooks/no-direct-main-push.mjs
    no-direct-main-push:
      priority: 27
      run: bun scripts/hooks/no-direct-main-push.mjs

    # ── 2. Lock file sync check ───────────────────────────────────────────────
    # Body: scripts/hooks/lockfile-sync.mjs
    lockfile-sync:
      priority: 28
      run: bun scripts/hooks/lockfile-sync.mjs

    # ── 3. Migration verify script ────────────────────────────────────────────
    # Body: scripts/hooks/migration-verify.mjs
    migration-verify:
      priority: 29
      glob: "supabase/migrations/*.sql"
      run: bun scripts/hooks/migration-verify.mjs

    # ── 4. Suppression count gate ─────────────────────────────────────────────
    # Tracks @ts-ignore / biome-ignore / eslint-disable across all of src/.
    # Starts at 7 (5 from audit + 2 deliberate a11y ignores on the contact
    # form's <output role="status"> banners: Chromium does not expose
    # <output>'s implicit status role to assistive tech or testing queries).
    # Currently 12. The per-addition reasoning is in the `run` block below.
    #
    # Fails if the count grows.
    # To raise the baseline: update the BASELINE value here AND in the comment
    # at the top of this file with a chore commit explaining why.
    suppress-count:
      priority: 30
      run: |
        # Baseline 7 → 9 → 10 → 12 → 15 → 22 → 24. None of the additions is a workaround for a
        # real defect; in two cases the rule is wrong rather than the code.
        #
        # Baseline 22 → 24, two `noDangerouslySetInnerHtml` on the security
        # boundary itself — both landed without bumping the baseline, which is
        # why main sat red on this gate:
        #
        #   1x CopyRegion.tsx — a copy region renders the sanitized body, the
        #      same boundary as the baselined ContentPreview suppression: the
        #      suppression *is* the boundary, not a workaround.
        #   1x app/layout.tsx — the theme bootstrap script, emitted from the
        #      pure `themeBootstrapScript()` in `lib/theme.ts` with no
        #      interpolation. A blocking first-paint script cannot be inlined
        #      any other way; the alternative is a flash of the wrong palette.
        #
        # Baseline 15 → 22, seven suppressions from the composer rewrite and the
        # media library:
        #
        #   4x noArrayIndexKey — list items, social channels, and their form
        #      inputs. Ephemeral rows without database IDs: the index is the
        #      identity, same as the baselined BlockEditor table cells. Adding
        #      stable ids to the model to satisfy the lint would change the
        #      serialized block format for no behavioural gain.
        #   3x noImgElement   — two block previews plus the storage-picker
        #      thumbnail, all rendering an image URL the admin just picked.
        #      Same admin-chrome reasoning as the baselined ContentPreview
        #      suppression: next/image cannot render an arbitrary host without
        #      a config entry per origin.
        #
        # Baseline 12 → 15, three more `noNoninteractiveTabindex` on the CRM
        # surfaces in this branch:
        #
        #   CRMBroadcastComposer — the campaign history table.
        #   CRMContactList, CRMDetailClient, CRMSubNav — the constituent
        #   directory table, the contact profile timeline, and the CRM sub-nav.
        #
        # Same WAI-ARIA scrollable-region pattern, same reasoning as the two
        # already baselined above: a wider-than-viewport region that is not a
        # tab stop cannot be scrolled by a keyboard user, and the rule flags it
        # precisely because it does not model the pattern.
        #
        # Baseline 10 → 12, both `noNoninteractiveTabindex`:
        #
        #   ContentList.tsx — the admin directory table, 46rem wide.
        #   BlockEditor.tsx — the table block, unbounded column count.
        #
        # Chrome and Firefox stopped making an `overflow-x-auto` container
        # focusable by default, so a region wider than its container cannot be
        # scrolled by a keyboard user at all without `tabIndex={0}`. The
        # WAI-ARIA Scrollable Region pattern — a named element that is a tab
        # stop — is precisely what the rule flags and does not model.
        # AGENTS.md § "Scrollable regions must be focusable" states the
        # requirement, and `ProductSlider` already carries the same suppression,
        # there file-wide in biome.json because it is a 100-line carousel.
        #
        # These two are suppressed per *element* with the reason inline rather
        # than per file. `BlockEditor` has thirty blocks; a file-scope
        # suppression there would hide a real `tabIndex` regression on any of
        # them, and a per-file one on `ContentList` would cover a component
        # that has exactly one scrollable region.
        #
        # Baseline 7 → 9 → 10, the content block editor and the preview:
        #
        #   4x noArrayIndexKey — table cells and list items. The rule exists to
        #      catch state being mis-associated when the order changes, and it
        #      does not model these: the table inputs are fully controlled
        #      (value and onChange both come from the block model, so React holds
        #      no per-cell state), and the list items' content is owned by the
        #      DOM by design, since React never renders it. The index is the
        #      identity. Adding stable ids to the model to satisfy the lint
        #      would change the serialized block format and the app/edge parity
        #      surface for no behavioural gain.
        #   1x noImgElement   — the editor previews the image URL the admin just
        #      typed. next.config's remotePatterns is scoped to the Supabase
        #      storage host, so next/image cannot render an arbitrary host
        #      without a config entry per origin, and would 400 on the first
        #      external image. This is admin chrome; the public page still uses
        #      next/image.
        #   1x noDangerouslySetInnerHtml — ContentPreview renders the sanitized
        #      body through the same sanitizeWPContent boundary as the public
        #      page. The suppression is the security boundary, not a workaround.
        BASELINE=24
        COUNT=$(grep -rn "@ts-ignore\|@ts-nocheck\|biome-ignore\|eslint-disable" \
          src --include="*.ts" --include="*.tsx" 2>/dev/null \
          | grep -v "__tests__" | wc -l | tr -d ' ')
        if [ "$COUNT" -gt "$BASELINE" ]; then
          echo ""
          echo "✖  Type/lint suppression count grew: ${COUNT} (baseline: ${BASELINE})"
          echo ""
          echo "   New suppressions found in src/. Fix the underlying issue instead."
          echo "   If the suppression is unavoidable, raise the BASELINE in lefthook.yml"
          echo "   with a chore commit explaining why."
          echo ""
          exit 1
        fi
        echo "✔  Suppression count: ${COUNT}/${BASELINE}"

    # ── 5. CI parity – mirrors the lint and build gates in .github/workflows/ci.yml ──
    lint-ci:
      priority: 31
      run: bun run lint:check

    # ── 6. Just-in-time migration dry-run ────────────────────────────────────
    # Body: scripts/hooks/migration-dryrun.mjs
    migration-dryrun:
      priority: 32
      glob: "supabase/migrations/*.sql"
      run: bun scripts/hooks/migration-dryrun.mjs

    tests:
      priority: 33
      run: bun run test

    typecheck:
      priority: 34
      run: bun tsc --noEmit

    # ── 7. Coverage threshold ─────────────────────────────────────────────────
    # Vitest enforces the configured statement, branch, function, and line gates.
    coverage:
      priority: 35
      run: bun run test:coverage

    # ── 8. Build smoke-test ───────────────────────────────────────────────────
    build-check:
      priority: 36
      run: NEXT_E2E_BUILD=true NEXT_SKIP_ENV_VALIDATION=1 bun run build

    # ── 9. Peer-dependency compatibility ──────────────────────────────────────
    # Checks the installed dependency graph before a build can reach deployment.
    peer-deps:
      priority: 37
      run: bun scripts/check-peer-deps.mjs --all

    # ── 10. Playwright e2e delivery gate ───────────────────────────────────────
    # Body: scripts/hooks/e2e-gate.mjs
    e2e:
      priority: 38
      run: bun scripts/hooks/e2e-gate.mjs

# ─── post-checkout ────────────────────────────────────────────────────────────
post-checkout:
  commands:
    deps-changed:
      run: bun scripts/hooks/post-checkout-deps.mjs {1} {2} {3}

# ─── post-merge ───────────────────────────────────────────────────────────────
post-merge:
  commands:
    auto-install:
      run: bun scripts/hooks/post-merge-auto-install.mjs

    regen-types-on-merge:
      run: bun scripts/hooks/post-merge-regen-types.mjs

# ─── pre-rebase ───────────────────────────────────────────────────────────────
pre-rebase:
  commands:
    warn-rebase-main:
      run: bun scripts/hooks/pre-rebase-warn-main.mjs {1}
